<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07090D">
<meta name="robots" content="noindex">
<title>Catálogo · Prime MX</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/index.min.css">

<script src="catalog.js"></script>
<script>
/* Se define ANTES de cargar catalog-img.js: ese archivo lo invoca al terminar
   y si no existe todavía, el aviso se pierde y las fotos nunca se pintan. */
window._onCatalogImgReady = function(){
  if(typeof window.pintar === 'function') window.pintar();
};
</script>
<script src="catalog-img.js"></script>

<style>
:root{
  --bg:#FBFBFD; --card:#FFF; --soft:#F5F5F7; --soft2:#F0F0F3;
  --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#86868B; --ink4:#B4B4BC;
  --line:#E8E8ED;
  --azul:#0082C6; --cyan:#5BC2E7; --negro:#07090D;
  --ok:#0B7A43; --ok-bg:#E9F6EE;
  --wa:#25D366;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ink);
  font-family:'Geist Variable','Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;
  font-feature-settings:'tnum' 1;overscroll-behavior-y:none}
button{font-family:inherit}
.nsb{scrollbar-width:none}
.nsb::-webkit-scrollbar{display:none}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:92px}
.pad{padding-left:22px;padding-right:22px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shim{0%{background-position:-460px 0}100%{background-position:460px 0}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,22px) scale(1.15)}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}

/* ── Cabecera ─────────────────────────────────────────────────────────── */
.top{background:var(--negro);padding:15px 22px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;
  padding-top:calc(15px + env(safe-area-inset-top))}
.top img{height:16px;display:block}
.top span{font-size:10px;font-weight:500;color:rgba(255,255,255,.55);
  letter-spacing:.05em;white-space:nowrap}

.hero{background:var(--card);padding:30px 22px 22px}
.hero h1{font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1.08;
  margin:0;max-width:560px}
.hero p{font-size:14.5px;color:var(--ink2);line-height:1.5;margin:11px 0 0;max-width:480px}

.buscar{margin-top:20px;max-width:480px;display:flex;align-items:center;gap:10px;
  background:var(--soft2);border-radius:14px;padding:0 15px}
.buscar svg{width:16px;height:16px;stroke:var(--ink3);flex-shrink:0}
.buscar input{flex:1;background:none;border:none;outline:none;font-family:inherit;
  font-size:15px;color:var(--ink);padding:14px 0;min-width:0}
.buscar input::placeholder{color:var(--ink3)}
.bx{background:none;border:none;color:var(--ink3);font-size:15px;padding:8px;
  cursor:pointer;display:none;line-height:1}
.bx.on{display:block}

/* ── Selector de plan ─────────────────────────────────────────────────── */
.plan-bar{background:var(--card);padding:20px 0 18px;border-bottom:1px solid var(--line)}
.plan-lbl{padding:0 22px 10px;font-size:10px;color:var(--ink3);
  letter-spacing:.14em;font-weight:700}
.planes{display:flex;gap:8px;overflow-x:auto;padding:0 0 0 22px}
.planes::after{content:'';flex:0 0 12px}
.pl{flex:0 0 auto;background:var(--soft);border:1.5px solid transparent;
  border-radius:15px;padding:11px 16px;cursor:pointer;text-align:center;min-width:72px;
  transition:all .22s cubic-bezier(.2,.7,.2,1)}
.pl.on{background:var(--azul);border-color:var(--azul);
  box-shadow:0 8px 20px -8px rgba(0,130,198,.55)}
.pl-n{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:1.2}
.pl.on .pl-n{color:#fff}
.pl-g{display:block;font-size:10px;color:var(--ink3);margin-top:2px}
.pl.on .pl-g{color:rgba(255,255,255,.8)}

.marcas{background:var(--card);padding:14px 0 15px 22px;border-bottom:1px solid var(--line);
  display:flex;gap:8px;overflow-x:auto}
.marcas::after{content:'';flex:0 0 12px}
.mk{flex:0 0 auto;background:var(--soft);color:var(--ink);border:none;
  border-radius:20px;padding:9px 16px;font-size:12.5px;cursor:pointer;transition:all .2s}
.mk.on{background:var(--ink);color:#fff;font-weight:600}

/* ── Secciones ────────────────────────────────────────────────────────── */
.sec{padding:26px 22px 4px}
.sec h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.15}
.sec p{font-size:13px;color:var(--ink2);margin:5px 0 0}

/* ── Franja de equipos sin costo ──────────────────────────────────────── */
.free{margin:26px 22px 0;position:relative;overflow:hidden;background:var(--negro);
  border-radius:26px;padding:26px 22px 22px}
.free-glow{position:absolute;top:-120px;right:-80px;width:340px;height:340px;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(0,168,224,.32) 0%,rgba(0,168,224,.08) 45%,transparent 70%);
  animation:drift 9s ease-in-out infinite alternate}
.free-k{position:relative;font-size:10px;font-weight:700;color:var(--cyan);letter-spacing:.14em}
.free-t{position:relative;font-size:24px;font-weight:800;color:#fff;
  letter-spacing:-.025em;line-height:1.15;margin-top:7px}
.free-s{position:relative;font-size:12.5px;color:rgba(255,255,255,.62);
  margin-top:5px;line-height:1.45}
.free-row{position:relative;display:flex;gap:10px;overflow-x:auto;margin-top:18px;padding-bottom:2px}
.fr{flex:0 0 108px;background:#fff;border:none;border-radius:16px;padding:10px;
  cursor:pointer;text-align:left;transition:transform .22s}
.fr:active{transform:scale(.96)}
.fr-i{display:flex;aspect-ratio:1;background:var(--soft);border-radius:11px;
  align-items:center;justify-content:center;overflow:hidden;margin-bottom:9px}
.fr-i img{max-width:72%;max-height:82%;object-fit:contain;
  filter:drop-shadow(0 6px 12px rgba(16,24,40,.14))}
.fr-n{display:block;font-size:11px;font-weight:700;color:var(--ink);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-p{display:block;font-size:11px;color:var(--ok);font-weight:700;margin-top:3px}

/* ── Carruseles y rejilla ─────────────────────────────────────────────── */
.fila{display:flex;gap:12px;overflow-x:auto;padding:16px 22px 6px}
.fila::after{content:'';flex:0 0 10px}
.fx{flex:0 0 150px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 22px 10px}

.eq{background:var(--card);border:none;border-radius:20px;padding:9px 9px 15px;
  cursor:pointer;text-align:left;display:block;width:100%;
  box-shadow:0 1px 2px rgba(16,24,40,.05);
  transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
.eq:active{transform:scale(.97)}
.eq-i{display:flex;aspect-ratio:.94;background:var(--soft);border-radius:14px;
  align-items:center;justify-content:center;position:relative;overflow:hidden}
.eq-i img{max-width:68%;max-height:80%;object-fit:contain;
  filter:drop-shadow(0 10px 18px rgba(16,24,40,.15));animation:fadeIn .5s ease}
.eq-i .ph{width:34px;height:34px;stroke:var(--ink4)}
.eq-b{display:block;padding:12px 6px 0}
.eq-mk{display:block;font-size:9px;color:var(--ink4);letter-spacing:.12em;font-weight:700}
.eq-n{display:block;font-size:14px;font-weight:600;line-height:1.28;margin-top:3px;
  letter-spacing:-.02em;color:var(--ink)}
.eq-s{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.eq-m{display:block;font-size:20px;font-weight:800;letter-spacing:-.04em;
  line-height:1;margin-top:11px}
.eq-m small{font-size:11px;color:var(--ink2);font-weight:400;letter-spacing:0}
.eq-e{display:block;font-size:10.5px;color:var(--ink3);margin-top:4px}
.eq-c{display:block;font-size:10px;color:var(--ink4);margin-top:3px}

.tag{position:absolute;top:9px;left:9px;font-size:9.5px;font-weight:800;
  padding:4px 9px;border-radius:20px;letter-spacing:.02em;
  background:var(--ok-bg);color:var(--ok)}
.tag3d{position:absolute;bottom:9px;right:9px;background:rgba(16,24,40,.85);
  color:#fff;font-size:9px;font-weight:700;padding:4px 8px;border-radius:20px;
  display:flex;align-items:center;gap:3px}
.tag3d svg{width:9px;height:9px;stroke:#fff}

.vertodo{margin:24px 22px 0;width:calc(100% - 44px);background:var(--card);
  border:1px solid var(--line);border-radius:18px;padding:17px;
  font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.vertodo svg{width:15px;height:15px;stroke:var(--azul)}
.vacio{padding:52px 28px;text-align:center;color:var(--ink2);font-size:14px;line-height:1.6}

/* ── Pie del asesor ───────────────────────────────────────────────────── */
.asesor{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding:13px 22px;
  padding-bottom:calc(13px + env(safe-area-inset-bottom))}
.asesor-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--azul);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.asesor-b{flex:1;min-width:0}
.asesor-n{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.3;letter-spacing:-.01em}
.asesor-s{display:block;font-size:11px;color:var(--ink3);line-height:1.3}
.wa{background:var(--wa);color:#fff;border:none;border-radius:22px;
  padding:12px 19px;font-size:13.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:7px;flex-shrink:0;transition:transform .2s}
.wa:active{transform:scale(.96)}
.wa svg{width:16px;height:16px;fill:#fff}

/* ── Detalle ──────────────────────────────────────────────────────────── */
.det{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;display:none}
.det.open{display:block;animation:sheetIn .34s cubic-bezier(.2,.8,.2,1)}
.det-in{max-width:560px;margin:0 auto;padding-bottom:44px}
.det-hero{background:var(--card);padding:14px 22px 0;
  padding-top:calc(14px + env(safe-area-inset-top))}
.volver{background:none;border:none;color:var(--azul);font-size:14.5px;
  display:flex;align-items:center;gap:5px;padding:0;margin-bottom:14px;cursor:pointer}
.volver svg{width:16px;height:16px;stroke:var(--azul)}
.det-img{height:250px;background:var(--soft);border-radius:24px;position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.det-img img{max-width:56%;max-height:84%;object-fit:contain;
  filter:drop-shadow(0 22px 40px rgba(16,24,40,.22))}
.ver3d{position:absolute;bottom:14px;right:14px;background:rgba(16,24,40,.85);
  color:#fff;border:none;border-radius:20px;padding:8px 14px;font-size:11.5px;
  font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.ver3d svg{width:13px;height:13px;stroke:var(--cyan)}

.det-b{background:var(--card);padding:20px 22px 26px}
.det-mk{font-size:10px;color:var(--ink3);letter-spacing:.14em;font-weight:700}
.det-n{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:6px 0 0}
.det-s{font-size:13px;color:var(--ink2);margin-top:4px}

.precio{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:20px;margin-top:20px}
.precio-top{display:flex;align-items:center;justify-content:space-between}
.precio-pl{font-size:12.5px;font-weight:700;color:var(--azul)}
.precio-gb{font-size:11px;color:var(--ink2)}
.precio-v{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:10px}
.precio-v small{font-size:14px;color:var(--ink2);font-weight:400;letter-spacing:0}
.precio-d{font-size:12px;color:var(--ink2);margin-top:5px}
.precio-c{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--soft2);flex-wrap:wrap}
.precio-c span{font-size:11.5px;color:var(--ink3)}
.pct{background:var(--ok-bg);color:var(--ok);font-size:10.5px;font-weight:800;
  padding:3px 9px;border-radius:20px}
.sello{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 13px;
  font-size:12.5px;font-weight:700;margin-top:12px;display:flex;align-items:center;gap:8px}
.sello svg{width:15px;height:15px;stroke:var(--ok)}

.blq{padding:20px 22px 0}
.lbl{font-size:10px;color:var(--ink3);letter-spacing:.14em;font-weight:700;margin-bottom:10px}
.otros{display:flex;flex-direction:column;gap:8px}
.otro{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;display:flex;align-items:center;cursor:pointer;width:100%;
  text-align:left;transition:all .2s}
.otro-n{flex:1;font-size:13.5px;font-weight:600}
.otro-g{font-size:11px;color:var(--ink2);width:50px;text-align:right}
.otro-m{font-size:14.5px;font-weight:700;width:78px;text-align:right;letter-spacing:-.02em}
.mas{background:none;border:none;color:var(--azul);font-size:12.5px;font-weight:600;
  padding:12px 0 0;cursor:pointer;width:100%;text-align:center}

.plazos{display:flex;gap:8px}
.sim{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.sim-top{display:flex;align-items:baseline;justify-content:space-between}
.sim-l{font-size:12.5px;color:var(--ink2)}
.sim-v{font-size:19px;font-weight:800;letter-spacing:-.03em}
input[type=range]{width:100%;margin:15px 0 6px;accent-color:var(--azul)}
.sim-lim{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3)}
.sim-out{margin-top:16px;padding-top:15px;border-top:1px solid var(--soft2);
  display:flex;align-items:baseline;justify-content:space-between}
.sim-out span{font-size:12.5px;color:var(--ink2)}
.sim-out b{font-size:24px;font-weight:800;letter-spacing:-.03em}
.sim-nota{font-size:11px;color:var(--ink3);line-height:1.5;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--soft2)}

/* Rentas de garantía: no es un enganche, son depósitos */
.rentas{display:flex;gap:8px}
.rt{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 8px;cursor:pointer;text-align:center;transition:all .2s}
.rt.on{background:var(--azul);border-color:var(--azul)}
.rt-n{display:block;font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.rt.on .rt-n{color:#fff}
.rt-l{display:block;font-size:9.5px;color:var(--ink3);margin-top:2px}
.rt.on .rt-l{color:rgba(255,255,255,.8)}

.incl{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:20px;padding:8px 13px;font-size:11.5px}

.cta{margin:22px 22px 0;background:var(--wa);border:none;border-radius:18px;
  padding:17px;width:calc(100% - 44px);color:#fff;font-size:15.5px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 12px 28px -12px rgba(37,211,102,.7);transition:transform .2s}
.cta:active{transform:scale(.98)}
.cta svg{width:19px;height:19px;fill:#fff}

/* ── Legal compacto ───────────────────────────────────────────────────── */
.legal{margin:30px 22px 0;padding-top:18px;border-top:1px solid var(--line)}
.legal p{font-size:10.5px;color:var(--ink4);line-height:1.6;margin:0}
.legal a{color:var(--ink3);text-decoration:underline}
.legal-mas{background:none;border:none;color:var(--azul);font-size:11px;
  padding:8px 0 0;cursor:pointer;font-weight:600}
.legal-full{font-size:10.5px;color:var(--ink4);line-height:1.65;margin-top:10px;display:none}
.legal-full.on{display:block}
.legal-full li{margin-bottom:6px}
.legal-full ul{margin:0;padding-left:15px}

.v3d{position:fixed;inset:0;z-index:200;background:var(--soft);
  display:flex;align-items:center;justify-content:center}
.v3d-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:18px;
  z-index:2;width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(16,24,40,.75);color:#fff;font-size:15px;cursor:pointer;line-height:1}
</style>
</head>
<body>

  <div class="top">

<script>
/* ══ CATÁLOGO PARA CLIENTES ═══════════════════════════════════════════════
   [v1.16] Diseño incorporado del rediseño de Claude Design.

   El PLAN es el eje: el cliente elige arriba y todo el catálogo se recalcula.
   La comparación pasa a ser entre EQUIPOS, no entre planes, y bajar de plan
   es un acto consciente en vez de un reflejo.

   Precios EN VIVO desde catalog.js: nunca se congelan en el enlace.
   Del asesor solo viaja el ATTUID; su tarjeta se lee de Firestore.
   ═════════════════════════════════════════════════════════════════════════ */

var HOY = new Date().toISOString().slice(0,10);
var qs  = new URLSearchParams(location.search);

var ASESOR = {
  attuid: qs.get('a')  || '',
  nombre: qs.get('n')  || '',
  tel:    (qs.get('t') || '').replace(/\D/g,''),
  tienda: qs.get('s')  || '',
  foto:   qs.get('f')  || ''
};

var PLANES = ['Azul 1','Azul 2','Azul 3','Plata','Oro','Black','Platino','Diamante'];

/* Abre en Oro: precios razonables con espacio para subir. */
var EST = { plan:'Oro', marca:'Todas', q:'', equipo:null, plazo:24,
            enganche:0, rentas:0, verTodos:false, verCatalogo:false };

function fmx(n){ return '$' + Math.round(n||0).toLocaleString('es-MX'); }
function ini(s){
  var p = String(s||'').trim().split(/\s+/);
  return ((p[0]||'')[0]||'') + ((p[1]||'')[0]||'');
}

/* ── Datos ────────────────────────────────────────────────────────────── */

function vigente(id){
  var v = (typeof VIGENCY!=='undefined') ? VIGENCY[id] : null;
  return !v || v==='indefinido' || v >= HOY;
}
function renta(p){
  var r=null; (PLANS_DATA||[]).forEach(function(x){ if(x.name===p) r=x.renta; });
  return r;
}
function gb(p){
  var g=null; (PLANS_DATA||[]).forEach(function(x){ if(x.name===p) g=x.gb; });
  return g;
}
/* Se lee de window.IMG en cada llamada: catalog-img.js pesa ~1 MB y puede
   terminar después de que este script corra. */
function img(id){
  var T = (typeof window!=='undefined') ? window.IMG : null;
  if(!T) return null;
  var v = T[id];
  if(typeof v==='string' && v.length<40 && T[v]) v = T[v];   // alias
  return (typeof v==='string' && v.length>60) ? v : null;
}
function tiene3D(id){
  return (typeof MODEL3D!=='undefined') && !!MODEL3D[id];
}

function promoDe(id, plan, plazo){
  var pr = PRICES[id];
  if(!pr || !pr.planes[plan]) return null;
  var v = pr.planes[plan][String(plazo)];
  return (v===null || v===undefined) ? null : v;
}

function descuento(id, plan, plazo){
  var pr=PRICES[id];
  var promo = promoDe(id, plan, plazo);
  if(!pr || !pr.contado || promo===null) return 0;
  return Math.floor((pr.contado - promo) / pr.contado * 100);
}

/* Mejor descuento del equipo con ese plan, para el sello de la tarjeta. */
function descMax(id, plan){
  var m=0;
  [24,30,36].forEach(function(z){
    var d=descuento(id, plan, z);
    if(d>m) m=d;
  });
  return m;
}

/*
   REGLA DE PAGO INICIAL — hay DOS esquemas, no uno:

   · descuento < 70%  →  ENGANCHE. Es anticipo del equipo: reduce el monto
                         financiado y por tanto BAJA la mensualidad.
                         Tope: 70% del precio promocional.

   · descuento ≥ 70%  →  RENTAS DE GARANTÍA (0 a 3). Es un DEPÓSITO, no un
                         anticipo: se paga al inicio pero NO reduce el precio
                         del equipo ni la mensualidad.

   Antes se trataban igual y en equipos con 85% de descuento se restaba la
   garantía del precio, lo que daba mensualidades más bajas de lo real.
*/
function esGarantia(id, plan, plazo){
  return descuento(id, plan, plazo) >= 70;
}

function topeEnganche(id, plan, plazo){
  var promo = promoDe(id, plan, plazo);
  if(promo===null || promo<=0) return 0;
  if(esGarantia(id, plan, plazo)) return 0;      // ahí van rentas, no enganche
  return Math.floor(Math.min(promo*0.70, promo) / 100) * 100;
}

/* Lo que el cliente paga al inicio con el esquema que le toque. */
function pagoInicial(id, plan, plazo, eng, rts){
  if(esGarantia(id, plan, plazo)) return (rts||0) * renta(plan);
  return eng || 0;
}

/* Mensualidad. El enganche la baja; las rentas de garantía NO. */
function mensual(id, plan, plazo, eng, rts){
  var promo = promoDe(id, plan, plazo);
  if(promo===null) return null;
  var financia = esGarantia(id, plan, plazo)
    ? promo                                   // la garantía no descuenta
    : Math.max(0, promo - (eng||0));
  return renta(plan) + Math.round(financia / plazo);
}

function mejorPlazo(id, plan){
  var min=null, z=null;
  [24,30,36].forEach(function(p){
    var m = mensual(id, plan, p, 0, 0);
    if(m===null) return;
    if(min===null || m<min){ min=m; z=p; }
  });
  return z===null ? null : { plazo:z, mensual:min };
}

function sinCosto(id, plan){
  return [24,30,36].some(function(z){ return promoDe(id, plan, z)===0; });
}

function equipos(plan){
  if(typeof CAT==='undefined') return [];
  var out=[];
  Object.keys(CAT).forEach(function(c){
    (CAT[c]||[]).forEach(function(d){
      if(!vigente(d.id) || !PRICES[d.id] || !PRICES[d.id].contado) return;
      if(mejorPlazo(d.id, plan)===null) return;   // no se vende con ese plan
      out.push(d);
    });
  });
  return out;
}

/* ── Render ───────────────────────────────────────────────────────────── */

function pintarPlanes(){
  document.getElementById('planes').innerHTML = PLANES.map(function(p){
    return '<button class="pl'+(EST.plan===p?' on':'')+'" onclick="setPlan(\''+p+'\')">'
      + '<span class="pl-n">'+p+'</span>'
      + '<span class="pl-g">'+(gb(p)||'—')+' GB</span></button>';
  }).join('');
  var act = document.querySelector('.pl.on');
  if(act && act.scrollIntoView) act.scrollIntoView({block:'nearest', inline:'center'});
}

function pintarMarcas(){
  var s={};
  equipos(EST.plan).forEach(function(d){ s[d.brand]=(s[d.brand]||0)+1; });
  var h = '<button class="mk'+(EST.marca==='Todas'?' on':'')+'" onclick="setMarca(\'Todas\')">Todas</button>';
  Object.keys(s).sort(function(a,b){ return s[b]-s[a]; }).forEach(function(m){
    h += '<button class="mk'+(EST.marca===m?' on':'')+'" onclick="setMarca(\''+m+'\')">'
       + m.charAt(0)+m.slice(1).toLowerCase()+'</button>';
  });
  document.getElementById('marcas').innerHTML = h;
}

function tarjeta(d, ancho){
  var mp = mejorPlazo(d.id, EST.plan);
  if(!mp) return '';
  var im = img(d.id);
  var free = sinCosto(d.id, EST.plan);
  var pct = descMax(d.id, EST.plan);
  return '<button class="eq'+(ancho?' fx':'')+'" onclick="abrir(\''+d.id+'\')">'
    + '<span class="eq-i">'
    + (im ? '<img src="'+im+'" alt="" loading="lazy">'

function pintar(){
  var todos = equipos(EST.plan);
  var q = EST.q.toLowerCase().trim();
  var filtrando = (EST.marca!=='Todas' || !!q);

  var lista = todos;
  if(EST.marca!=='Todas') lista = lista.filter(function(d){ return d.brand===EST.marca; });
  if(q) lista = lista.filter(function(d){
    return (d.name+' '+d.brand+' '+d.storage).toLowerCase().indexOf(q) >= 0;
  });
  lista.sort(function(a,b){
    var x=mejorPlazo(a.id,EST.plan), y=mejorPlazo(b.id,EST.plan);
    return (x?x.mensual:9e9)-(y?y.mensual:9e9);
  });

  var h='';

  if(filtrando || EST.verCatalogo){
    if(EST.verCatalogo && !filtrando){
      h += '<div class="sec"><h2>Todos los equipos</h2>'
         + '<p>Precios con plan '+EST.plan+'</p></div>';
    }
    h += lista.length
      ? '<div class="grid">'+lista.map(function(d){ return tarjeta(d); }).join('')+'</div>'
      : '<div class="vacio">No hay equipos con esa búsqueda.<br>Prueba con otra marca o plan.</div>';
    h += pieLegal();
    document.getElementById('cuerpo').innerHTML=h;
    return;
  }

  /* ── Vitrina ── */
  var free = todos.filter(function(d){ return sinCosto(d.id, EST.plan); });
  if(free.length){
    h += '<div class="free"><div class="free-glow"></div>'
      + '<div class="free-k">EQUIPOS SIN COSTO</div>'
      + '<div class="free-t">'+free.length+' equipos, $0 de equipo</div>'
      + '<div class="free-s">Con plan '+EST.plan+' solo pagas tu renta de '+fmx(renta(EST.plan))+'</div>'
      + '<div class="free-row nsb">'
      + free.slice(0,10).map(function(d){
          var im=img(d.id);
          return '<button class="fr" onclick="abrir(\''+d.id+'\')">'
            + '<span class="fr-i">'+(im?'<img src="'+im+'" alt="" loading="lazy">':'')+'</span>'
            + '<span class="fr-n">'+d.name+'</span>'
            + '<span class="fr-p">'+fmx(renta(EST.plan))+'/mes</span></button>';
        }).join('')
      + '</div></div>';
  }

  var ofertas = todos.filter(function(d){ return !sinCosto(d.id, EST.plan); })
    .sort(function(a,b){ return descMax(b.id,EST.plan)-descMax(a.id,EST.plan); })
    .slice(0,10);
  if(ofertas.length){
    h += '<div class="sec"><h2>Ofertas del momento</h2>'
       + '<p>Los mejores descuentos de esta semana</p></div>'
       + '<div class="fila nsb">'+ofertas.map(function(d){ return tarjeta(d,1); }).join('')+'</div>';
  }

  var nuevos = todos.filter(function(d){ return d.status==='NPI'; }).slice(0,10);
  if(nuevos.length){
    h += '<div class="sec"><h2>Recién llegados</h2>'
       + '<p>Lo más nuevo del catálogo</p></div>'
       + '<div class="fila nsb">'+nuevos.map(function(d){ return tarjeta(d,1); }).join('')+'</div>';
  }

  h += '<button class="vertodo" onclick="abrirCatalogo()">Ver todos los equipos'
    + '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>';
  h += pieLegal();
  document.getElementById('cuerpo').innerHTML=h;
}

function abrirCatalogo(){ EST.verCatalogo=true; pintar(); window.scrollTo(0,0); }

/* Trae la tarjeta del asesor por REST: cargar el SDK completo para leer un
   documento haría más lenta la primera impresión. */
function cargarAsesor(){
  pintarAsesor();
  if(!ASESOR.attuid || ASESOR.nombre) return;
  var url = 'https://firestore.googleapis.com/v1/projects/techguide-primemx'
          + '/databases/(default)/documents/asesores_publicos/'
          + encodeURIComponent(ASESOR.attuid);
  fetch(url).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if(j && j.fields){
      var f=j.fields;
      ASESOR.nombre = (f.nombre  && f.nombre.stringValue)  || ASESOR.nombre;
      ASESOR.tel    = (f.telefono&& f.telefono.stringValue)|| ASESOR.tel;
      ASESOR.tienda = (f.tienda  && f.tienda.stringValue)  || ASESOR.tienda;
      ASESOR.foto   = (f.foto    && f.foto.stringValue)    || ASESOR.foto;
    }
  }).catch(function(){}).then(function(){ pintarAsesor(); });
}

/* ── Detalle ──────────────────────────────────────────────────────────── */

function abrir(id){
  var d=null;
  Object.keys(CAT).forEach(function(c){ (CAT[c]||[]).forEach(function(x){ if(x.id===id) d=x; }); });
  if(!d) return;
  var mp = mejorPlazo(id, EST.plan);
  EST.equipo=d; EST.plazo = mp ? mp.plazo : 24;
  EST.enganche=0; EST.rentas=0; EST.verTodos=false;
  pintarDetalle();
  document.getElementById('det').classList.add('open');
  document.body.style.overflow='hidden';
  window.scrollTo(0,0);
  history.pushState({det:1},'','#'+id);
}
function cerrarDetalle(){
  document.getElementById('det').classList.remove('open');
  document.body.style.overflow=''; EST.equipo=null;
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
}

/* Solo los planes vecinos: ver los ocho de golpe empujaba al más barato. */
function planesVecinos(){
  var d=EST.equipo;
  var con = PLANES.filter(function(p){ return mensual(d.id,p,EST.plazo,0,0)!==null; });
  if(EST.verTodos) return con.filter(function(p){ return p!==EST.plan; });
  var i = con.indexOf(EST.plan);
  return con.slice(Math.max(0,i-1), i+2).filter(function(p){ return p!==EST.plan; });
}

/* ── Compartir ────────────────────────────────────────────────────────── */

function compartir(texto){
  if(!ASESOR.tel){
    if(navigator.share){ navigator.share({ text:texto }).catch(function(){}); return; }
    window.open('https://wa.me/?text='+encodeURIComponent(texto), '_blank', 'noopener');
    return;
  }
  var txt = encodeURIComponent(texto);
  var respaldo = 'https://wa.me/'+ASESOR.tel+'?text='+txt;
  var esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'');
  if(!esMovil){ window.open(respaldo, '_blank', 'noopener'); return; }

  /* whatsapp:// apunta a Messenger. Si tiene Business instalado, wa.me lo
     elegía por defecto y salía "tu número no está registrado". */
  var salio=false;
  function seFue(){ salio=true; }
  document.addEventListener('visibilitychange', seFue, { once:true });
  window.addEventListener('pagehide', seFue, { once:true });
  window.addEventListener('blur', seFue, { once:true });
  location.href = 'whatsapp://send?phone='+ASESOR.tel+'&text='+txt;
  setTimeout(function(){
    document.removeEventListener('visibilitychange', seFue);
    if(!salio && !document.hidden) window.open(respaldo, '_blank', 'noopener');
  }, 1200);
}

function escribir(){
  compartir('Hola'+(ASESOR.nombre?' '+ASESOR.nombre.split(' ')[0]:'')
    + ', vi el catálogo y me interesa conocer más opciones.');
}

function meInteresa(){
  var d=EST.equipo; if(!d) return;
  var m = mensual(d.id, EST.plan, EST.plazo, EST.enganche, EST.rentas);
  var gar = esGarantia(d.id, EST.plan, EST.plazo);
  var inicial = pagoInicial(d.id, EST.plan, EST.plazo, EST.enganche, EST.rentas);
  compartir('Hola'+(ASESOR.nombre?' '+ASESOR.nombre.split(' ')[0]:'')+', me interesa esta opción:\n\n'
    + d.name+' '+d.storage+'\n\n'
    + 'Plan AT&T '+EST.plan+' · '+EST.plazo+' meses\n'
    + (gar
        ? (EST.rentas+' '+(EST.rentas===1?'renta':'rentas')+' de garantía ('+fmx(inicial)+')')
        : ('Pago inicial estimado '+fmx(inicial)))
    + '\nMensualidad estimada '+fmx(m)+'\n\n¿Cómo seguimos?');
}

function ver3D(){
  var d=EST.equipo; if(!d) return;
  var m = (typeof MODEL3D!=='undefined') ? MODEL3D[d.id] : null;
  if(typeof m==='string' && MODEL3D[m]) m = MODEL3D[m];
  if(!m || !m.src) return;
  var cap = document.createElement('div');
  cap.className='v3d';
  cap.innerHTML = '<button class="v3d-x" onclick="cerrar3D()" aria-label="Cerrar">&#10005;</button>'
    + '<model-viewer src="'+m.src+'"'+(m.ios?' ios-src="'+m.ios+'"':'')
    + ' alt="'+d.name+'" camera-controls auto-rotate ar'
    + ' ar-modes="webxr scene-viewer quick-look" shadow-intensity="1"'
    + ' style="width:100%;height:100%;background:#F5F5F7"></model-viewer>';
  document.body.appendChild(cap);
  if(!window._mvCargado){
    var s=document.createElement('script');
    s.type='module';
    s.src='https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js';
    document.head.appendChild(s);
    window._mvCargado=true;
  }
}
function cerrar3D(){
  var c=document.querySelector('.v3d'); if(!c) return;
  /* Liberar la GPU antes de quitar el nodo. */
  var mv=c.querySelector('model-viewer'); if(mv) mv.removeAttribute('src');
  c.remove();
}

/* ── Interacción ──────────────────────────────────────────────────────── */

function setPlan(p, dentro){
  EST.plan=p;
  pintarPlanes(); pintarMarcas(); pintar();
  if(dentro && EST.equipo){
    var mp=mejorPlazo(EST.equipo.id, p);
    if(mp) EST.plazo=mp.plazo;
    EST.enganche=0; EST.rentas=0;
    pintarDetalle();
    var det=document.getElementById('det');
    if(det) det.scrollTop=0;
  } else {
    window.scrollTo(0,0);
  }
}
function setMarca(m){
  EST.marca=m;
  if(m==='Todas') EST.verCatalogo=false;
  pintarMarcas(); pintar(); window.scrollTo(0,0);
}
function setPlazo(z){ EST.plazo=z; EST.enganche=0; EST.rentas=0; pintarDetalle(); }
function setRentas(n){ EST.rentas=n; pintarDetalle(); }
function verTodosPlanes(){ EST.verTodos=true; pintarDetalle(); }
function limpiar(){
  EST.q=''; document.getElementById('q').value='';
  document.getElementById('qx').classList.remove('on'); pintar();
}

document.getElementById('q').addEventListener('input', function(e){
  EST.q=e.target.value;
  document.getElementById('qx').classList.toggle('on', !!EST.q);
  pintar();
});
window.addEventListener('popstate', function(){ if(EST.equipo) cerrarDetalle(); });

function iniciar(){
  if(typeof CAT==='undefined'){
    document.getElementById('cuerpo').innerHTML =
      '<div class="vacio">No pudimos cargar el catálogo.<br>Revisa tu conexión.</div>';
    return;
  }
  pintarPlanes(); pintarMarcas(); pintar(); cargarAsesor();
}
