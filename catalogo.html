/* Modernist — tokens retuned for PRIMEMX: identidad azul tecnológica-comercial propia
   (estructura y disciplina Modernist intactas; ver readme del sistema). */
/* [v1.32] Fuente vía <link> con preconnect: el @import bloqueaba el primer render. */

:root {
  --color-bg: #ffffff;
  --color-surface: #f5f5f7;
  --color-text: #1d1d1f;
  --color-accent: #0060a0;
  --color-accent-2: #0082c6;
  --color-navy: #1a2440; /* [v1.32] navy de marca (logo/manifest) */
  --color-divider: color-mix(in srgb, #1d1d1f 40%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f7f7f9;
  --color-neutral-200: #ececef;
  --color-neutral-300: #dcdce1;
  --color-neutral-400: #b6b6bd;
  --color-neutral-500: #8e8e93;
  --color-neutral-600: #6e6e73;
  --color-neutral-700: #545459;
  --color-neutral-800: #3c3c41;
  --color-neutral-900: #26262b;

  --color-accent-100: #eaf4fb;
  --color-accent-200: #d2e8f7;
  --color-accent-300: #aad5f0;
  --color-accent-400: #5bc2e7;
  --color-accent-500: #0082c6;
  --color-accent-600: #004e83;
  --color-accent-700: #013e68;
  --color-accent-800: #0d3050;
  --color-accent-900: #0f2337;

  --color-accent-2-100: #eaf4fb;
  --color-accent-2-200: #d2e8f7;
  --color-accent-2-300: #aad5f0;
  --color-accent-2-400: #5bc2e7;
  --color-accent-2-500: #0082c6;
  --color-accent-2-600: #004e83;
  --color-accent-2-700: #013e68;
  --color-accent-2-800: #0d3050;
  --color-accent-2-900: #0f2337;

  --font-heading: "Geist", system-ui, sans-serif;
  --font-heading-weight: 800;
  --font-body: "Geist", system-ui, sans-serif;

  --space-1: 4.0px;
  --space-2: 8.0px;
  --space-3: 12.0px;
  --space-4: 16.0px;
  --space-6: 24.0px;
  --space-8: 32.0px;

  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #26262b 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #26262b 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #26262b 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

/* [retheme] El producto es el héroe: fotografía a color (el wrapper se conserva por compatibilidad). */
.grayscale{filter:none}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; font-feature-settings: 'tnum' 1; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 2px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: 2px solid var(--color-divider);
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid var(--color-divider);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* [v1.24] Más chicas y más densas: caben tres por fila en móvil, así se ven
   más como escaparate y menos como bloques sueltos. */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));
  gap:10px;padding:4px 0 2px}
/* Carrusel: una fila que se desliza, con el corte del borde insinuando que
   hay más. */
.prow{display:flex;gap:10px;overflow-x:auto;padding:4px 0 6px;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.prow .pcard{flex:0 0 158px;scroll-snap-align:start}
.prow::after{content:'';flex:0 0 4px}
/* [v1.23] Las tarjetas eran celdas planas de una hoja de cálculo: solo
   bordes de 1px. Ahora tienen cuerpo propio — fondo blanco, sombra sutil y
   respuesta al tacto — sin perder la retícula del sistema. */
.pcard{display:flex;flex-direction:column;align-items:stretch;min-width:0;
  text-align:left;background:#fff;border:1px solid var(--color-neutral-300);border-radius:12px;
  padding:8px 8px 13px;cursor:pointer;font-family:inherit;color:inherit;
  font-size:15px;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(45,43,43,.05);
  transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease}
/* Filo de acento que aparece al tocar: da carácter sin romper la retícula. */
.pcard::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:var(--color-accent);transform:scaleX(0);transform-origin:left;
  transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.pcard:hover::after,.pcard:active::after{transform:scaleX(1)}
.pcard:hover{box-shadow:0 8px 22px rgba(45,43,43,.14);transform:translateY(-3px);
  border-color:var(--color-neutral-400)}
.pcard:active{transform:translateY(-1px) scale(.99)}
.pcard:hover{background:var(--color-neutral-100)}
.pimg{position:relative;display:flex;align-items:center;justify-content:center;
  aspect-ratio:1/.96;background:var(--color-surface);overflow:hidden;border-radius:7px}
.pcard .pimg img{max-width:66%;max-height:78%;transition:transform .25s ease}
.pcard:hover .pimg img{transform:scale(1.045)}
.pimg img{max-width:64%;max-height:78%;object-fit:contain;mix-blend-mode:multiply}

 auditoria:function(){var self=this,iss=[],C=window.CAT||{},P=window.PRICES||{},SV=window.STORAGE_VARIANTS||{},seen={};
  var all=[];Object.keys(C).forEach(function(k){(C[k]||[]).forEach(function(d){all.push(d);});});
  all.forEach(function(d){
   if(seen[d.id])iss.push({id:d.id,campo:'id',problema:'ID duplicado en CAT'});seen[d.id]=1;
   if(!P[d.id]||!P[d.id].contado)iss.push({id:d.id,campo:'precio',problema:'Sin precio de contado'});
   if(!self.img(d.id))iss.push({id:d.id,campo:'imagen',problema:'Sin imagen'});
   var st=(d.storage||'').replace(/\s/g,'').toUpperCase(),sp='';
   Object.keys(d.specs||{}).forEach(function(k){if(/almacenamiento|memoria/i.test(k))sp=String(d.specs[k]);});
   if(sp&&st&&sp.replace(/\s/g,'').toUpperCase().indexOf(st)<0)iss.push({id:d.id,campo:'storage',problema:'Tarjeta dice "'+d.storage+'" y la ficha "'+sp+'"'});
   (d.sell||[]).forEach(function(t){if(/vende|cierr[ae]|vendedor|demo|urgencia|argumento/i.test(t))iss.push({id:d.id,campo:'copy',problema:'Posible copy interno visible: "'+t.slice(0,70)+'"'});});
   if(self.vigente(d.id)&&self.baseOf(d.id)===d.id&&P[d.id]&&P[d.id].contado&&self.desdeGlobal(d.id)===null)iss.push({id:d.id,campo:'planes',problema:'Vigente pero sin mensualidad en su rango de planes'});
  });
  Object.keys(SV).forEach(function(b){(SV[b]||[]).forEach(function(v){if(v[1]&&!P[v[1]])iss.push({id:v[1],campo:'variante',problema:'Variante "'+v[0]+'" de '+b+' sin entrada en PRICES'});});});
  if(iss.length){console.warn('[PRIMEMX] Auditoría: '+iss.length+' hallazgos');console.table(iss);}
  else console.info('[PRIMEMX] Auditoría: sin hallazgos');
  return iss;},

  if(!this.ready()){var poll=setInterval(function(){if(self.ready()){clearInterval(poll);self.render();}},80);}
  var retry=0;
  var watch=setInterval(function(){
   var needData=!window.CAT,needImg=!window.IMG||Object.keys(window.IMG||{}).length===0;
   if(!needData&&!needImg){clearInterval(watch);return;}
   if(retry>=3){clearInterval(watch);return;}
   retry++;
   if(needData){var s1=document.createElement('script');s1.src='catalog.js';document.head.appendChild(s1);}
   if(needImg){var s2=document.createElement('script');s2.src='catalog-img.js';document.head.appendChild(s2);}
  },2500);}
};
APP.init();
window.PRIMEMX_AUDIT=function(){return APP.auditoria();};
if(/[?&]debug=1/.test(location.search)){(function(){var t=setInterval(function(){if(APP.ready()){clearInterval(t);APP.auditoria();}},400);})();}
