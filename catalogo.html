<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Catálogo · Prime MX</title>

<!-- Geist (Vercel): diseñada para interfaces, números inequívocos.
     Si el CDN falla, cae a la fuente de sistema sin romper nada. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/index.min.css">

<!-- Sin defer: con defer las tarjetas se pintaban antes de que IMG existiera
     y salían sin foto. -->
<script src="catalog.js"></script>
<script src="catalog-img.js"></script>

<style>
:root{
  --bg:#F4F5F7; --card:#FFF; --soft:#FAFBFC;   /* el fondo de foto casi blanco: el producto respira */
  --ink:#101828; --ink2:#667085; --ink3:#98A2B3; --ink4:#CDD3DC;
  --line:#EAECF0;
  --att:#00A8E0; --ok:#12784A; --ok-bg:#E7F7EE; --wa:#25D366;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:'Geist Variable','Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;
  font-feature-settings:'tnum' 1;}   /* cifras de ancho fijo: los precios alinean */
.wrap{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px}
button{font-family:inherit}

.top{background:var(--card);padding:16px 18px 0;
  padding-top:calc(16px + env(safe-area-inset-top));
  border-top:3px solid var(--att)}   /* el azul AT&T ancla la marca sin saturar */
.top-row{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:14px;font-weight:800;letter-spacing:.3px}
.logo i{color:var(--att);font-style:normal}
.dist{font-size:10.5px;color:var(--ink2)}

.buscar{background:var(--card);padding:15px 18px 16px}
.buscar-in{background:var(--soft);border-radius:12px;padding:0 14px;
  display:flex;align-items:center;gap:10px}
.buscar-in svg{width:17px;height:17px;stroke:var(--ink3);flex-shrink:0}
.buscar input{flex:1;background:none;border:none;outline:none;font-family:inherit;
  font-size:15px;color:var(--ink);padding:13px 0;min-width:0}
.buscar input::placeholder{color:var(--ink3)}
.bx{background:none;border:none;color:var(--ink3);font-size:15px;padding:8px;
  cursor:pointer;display:none;line-height:1}
.bx.on{display:block}

.plan-bar{background:var(--card);border-bottom:1px solid var(--line);padding:0 0 14px}
.plan-lbl{padding:0 18px 8px;font-size:10px;color:var(--ink2);letter-spacing:.6px;font-weight:700}
.planes{display:flex;gap:7px;overflow-x:auto;padding:0 0 0 18px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.planes::-webkit-scrollbar{display:none}
.planes::after{content:'';flex:0 0 10px}
.pl{flex:0 0 auto;background:var(--soft);border:1.5px solid transparent;
  border-radius:13px;padding:9px 14px;cursor:pointer;text-align:center;min-width:66px}
.pl.on{background:var(--att);border-color:var(--att)}
.pl-n{display:block;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.2}
.pl.on .pl-n{color:#fff}
.pl-g{display:block;font-size:9.5px;color:var(--ink2);margin-top:1px}
.pl.on .pl-g{color:rgba(255,255,255,.85)}

.marcas{background:var(--card);padding:12px 0 13px 18px;border-bottom:1px solid var(--line);
  display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.marcas::-webkit-scrollbar{display:none}
.marcas::after{content:'';flex:0 0 10px}
.mk{flex:0 0 auto;background:var(--soft);color:var(--ink);border:none;
  border-radius:20px;padding:8px 15px;font-size:12.5px;cursor:pointer}
.mk.on{background:var(--ink);color:#fff;font-weight:600}

.sec{padding:22px 18px 12px}
.sec h2{font-size:19px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.2}
.sec p{font-size:12.5px;color:var(--ink2);margin:4px 0 0;line-height:1.4}

.gratis{margin:18px 18px 0;background:var(--ink);border-radius:var(--r);
  padding:16px 17px;color:#fff}
.gratis-t{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.gratis-s{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:3px;line-height:1.4}
.gratis-row{display:flex;gap:9px;margin-top:14px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.gratis-row::-webkit-scrollbar{display:none}
.gr{flex:0 0 98px;background:#fff;border:none;border-radius:12px;padding:9px;
  cursor:pointer;text-align:left}
.gr-img{height:68px;background:var(--soft);border-radius:8px;margin-bottom:7px;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.gr-img img{max-width:82%;max-height:88%;object-fit:contain}
.gr-n{display:block;font-size:10px;font-weight:700;color:var(--ink);line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-p{display:block;font-size:10px;color:var(--ok);font-weight:700;margin-top:2px}

.fila{display:flex;gap:11px;overflow-x:auto;padding:0 18px 4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.fila::-webkit-scrollbar{display:none}
.fila::after{content:'';flex:0 0 6px}
.fx{flex:0 0 132px;background:var(--card);border:none;border-radius:var(--r);
  padding:12px;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.fx-img{display:flex;height:104px;background:var(--soft);border-radius:11px;
  align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px}
.fx-img img{max-width:64%;max-height:80%;object-fit:contain}
.fx-n{display:block;font-size:12px;font-weight:500;color:var(--ink);line-height:1.3;
  letter-spacing:-.01em;height:31px;overflow:hidden}
.fx-p{display:block;font-size:14px;font-weight:700;letter-spacing:-.03em;margin-top:5px}
.vertodo{margin:24px 18px 8px;width:calc(100% - 36px);background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;
  font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px}
.vertodo svg{width:15px;height:15px;stroke:var(--att)}
.grid{padding:12px 18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.eq{background:var(--card);border-radius:var(--r);padding:14px 14px 15px;border:none;
  text-align:left;cursor:pointer;display:block;width:100%;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.eq:active{opacity:.72}
/* Más alto y con la foto más chica dentro: el producto respira, se ve caro. */
.eq-img{height:126px;background:var(--soft);border-radius:12px;margin-bottom:13px;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.eq-img img{max-width:62%;max-height:78%;object-fit:contain}
.eq-img .ph{width:32px;height:32px;stroke:var(--ink4)}
/* display:block por línea: antes eran spans inline y el texto se encimaba
   — "Honor 400 + Balón512 GBdesde $507/mes". */
/* Jerarquía: marca susurrada, nombre medio, precio dominante. Sin línea
   divisoria — la tarjeta blanca sobre gris ya separa lo suficiente. */
.eq-mk{display:block;font-size:8.5px;color:var(--ink4);letter-spacing:1px;font-weight:600}
.eq-n{display:block;font-size:13.5px;font-weight:500;line-height:1.28;margin-top:3px;
  letter-spacing:-.015em;color:var(--ink)}
.eq-s{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px}
.eq-p{display:block;margin-top:12px}
.eq-m{display:block;font-size:19px;font-weight:700;letter-spacing:-.035em;line-height:1}
.eq-m small{font-size:10.5px;color:var(--ink2);font-weight:400;letter-spacing:0}
.eq-e{display:block;font-size:10px;color:var(--ink3);margin-top:4px}

.tag{position:absolute;top:8px;right:8px;background:var(--ok-bg);color:var(--ok);
  font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.2px}
.tag3d{position:absolute;top:8px;left:8px;background:rgba(16,24,40,.88);color:#fff;
  font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;
  display:flex;align-items:center;gap:3px}
.tag3d svg{width:9px;height:9px;stroke:#fff}

.vacio{padding:48px 28px;text-align:center;color:var(--ink2);font-size:14px;line-height:1.6}

.asesor{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);
  backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);
  padding:13px 18px;padding-bottom:calc(13px + env(safe-area-inset-bottom))}
.asesor-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--att);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13.5px;
  font-weight:700;flex-shrink:0}
.asesor-b{flex:1;min-width:0}
.asesor-n{display:block;font-size:13px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.asesor-s{display:block;font-size:10.5px;color:var(--ink2);line-height:1.3}
.wa{background:var(--wa);color:#fff;border:none;border-radius:22px;
  padding:11px 17px;font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:6px;flex-shrink:0}
.wa svg{width:16px;height:16px;fill:#fff}

.det{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;display:none}
.det.open{display:block}
.det-in{max-width:520px;margin:0 auto;padding-bottom:40px}
.det-top{background:var(--card);padding:14px 18px 20px;
  padding-top:calc(14px + env(safe-area-inset-top))}
.volver{background:none;border:none;color:var(--att);font-size:14.5px;
  display:flex;align-items:center;gap:4px;padding:0;margin-bottom:16px;cursor:pointer}
.volver svg{width:16px;height:16px;stroke:var(--att)}
.det-img{height:186px;background:var(--soft);border-radius:14px;
  display:flex;align-items:center;justify-content:center;margin-bottom:15px;overflow:hidden}
.det-img img{max-width:66%;max-height:92%;object-fit:contain}
.det-mk{font-size:8.5px;color:var(--ink3);letter-spacing:.9px;font-weight:700}
.det-n{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-top:2px}
.det-s{font-size:12px;color:var(--ink2);margin-top:3px}
.ver3d{margin-top:12px;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);border-radius:20px;padding:7px 13px;
  font-size:11.5px;background:none;cursor:pointer;color:var(--ink);font-weight:600}
.ver3d svg{width:13px;height:13px;stroke:var(--att)}

.blq{padding:18px 18px 0}
.lbl{font-size:10px;color:var(--ink2);letter-spacing:.6px;font-weight:700;margin-bottom:9px}

.precio{background:var(--card);border-radius:var(--r);padding:17px;border:1.5px solid var(--att)}
.precio-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.precio-pl{font-size:13px;font-weight:700;color:var(--att)}
.precio-gb{font-size:11px;color:var(--ink2)}
.precio-v{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.precio-v small{font-size:13px;color:var(--ink2);font-weight:400;letter-spacing:0}
.precio-d{font-size:11.5px;color:var(--ink2);margin-top:5px}
.sello{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:9px 12px;
  font-size:12px;font-weight:700;margin-top:12px;display:flex;align-items:center;gap:7px}
.sello svg{width:15px;height:15px;stroke:var(--ok)}

.otros{display:flex;flex-direction:column;gap:7px}
.otro{background:var(--card);border:none;border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;cursor:pointer;width:100%;text-align:left}
.otro-n{flex:1;font-size:13px;font-weight:600}
.otro-g{font-size:11px;color:var(--ink2);width:48px;text-align:right}
.otro-m{font-size:14px;font-weight:700;width:74px;text-align:right}
.mas{background:none;border:none;color:var(--att);font-size:12.5px;font-weight:600;
  padding:11px 0 0;cursor:pointer;width:100%;text-align:center}

.sim{background:var(--card);border-radius:var(--r);padding:16px}
.sim-top{display:flex;align-items:baseline;justify-content:space-between}
.sim-l{font-size:12.5px;color:var(--ink2)}
.sim-v{font-size:18px;font-weight:800;letter-spacing:-.02em}
input[type=range]{width:100%;margin:14px 0 6px;accent-color:var(--att)}
.sim-lim{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3)}
.sim-out{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;align-items:baseline;justify-content:space-between}
.sim-out span{font-size:12.5px;color:var(--ink2)}
.sim-out b{font-size:23px;font-weight:800;letter-spacing:-.025em}

.incl{background:var(--card);border-radius:var(--r);padding:15px 16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--soft);border-radius:20px;padding:7px 12px;font-size:11px;color:var(--ink)}

.nota{background:var(--card);border-radius:12px;padding:13px 14px;display:flex;
  gap:10px;align-items:flex-start;margin:16px 18px 0}
.nota svg{width:16px;height:16px;stroke:var(--att);flex-shrink:0;margin-top:1px}
.nota span{font-size:11px;color:var(--ink2);line-height:1.5}

.cta{margin:18px 18px 0;background:var(--wa);border:none;border-radius:var(--r);
  padding:16px;width:calc(100% - 36px);color:#fff;font-size:15px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.cta svg{width:19px;height:19px;fill:#fff}
.v3d{position:fixed;inset:0;z-index:200;background:#F1F3F6;display:flex;
  align-items:center;justify-content:center}
.v3d-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;
  z-index:2;width:38px;height:38px;border-radius:50%;border:none;
  background:rgba(16,24,40,.72);color:#fff;font-size:15px;cursor:pointer;line-height:1}
.v3d-by{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-size:10.5px;color:var(--ink3)}
.pie{text-align:center;font-size:10.5px;color:var(--ink3);padding:20px 28px 0;line-height:1.6}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="top-row">
      <span class="logo">PRIME<i>MX</i></span>
      <span class="dist">Distribuidor AT&amp;T</span>
    </div>
  </div>

  <div class="buscar">
    <div class="buscar-in">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar equipo" autocomplete="off" enterkeyhint="search">
      <button class="bx" id="qx" onclick="limpiar()" aria-label="Limpiar">&#10005;</button>
    </div>
  </div>

  <div class="plan-bar">
    <div class="plan-lbl">ELIGE TU PLAN</div>
    <div class="planes" id="planes"></div>
  </div>

  <div class="marcas" id="marcas"></div>
  <div id="cuerpo"></div>
</div>

<div class="asesor" id="asesor"></div>
<div class="det" id="det"><div class="det-in" id="det-in"></div></div>

<script>
/* ══ CATÁLOGO PARA CLIENTES ═══════════════════════════════════════════════
   [v1.14] Reescrito con el PLAN como eje.

   Antes se mostraban los 8 planes de cada equipo a la vez: el cliente se
   anclaba en el más barato por reflejo. Ahora elige plan arriba y todo el
   catálogo se recalcula — la comparación pasa a ser entre EQUIPOS, y bajar
   de plan es un acto consciente.

   Los equipos sin precio en el plan elegido no se muestran: así los premium
   no aparecen en planes donde no se venden.

   Precios EN VIVO desde catalog.js: nunca se congelan en el enlace.
   ═════════════════════════════════════════════════════════════════════════ */

var HOY = new Date().toISOString().slice(0,10);
var qs  = new URLSearchParams(location.search);

var ASESOR = {
  attuid: qs.get('a')  || '',
  nombre: qs.get('n')  || '',
  tel:    (qs.get('t') || '').replace(/\D/g,''),
  tienda: qs.get('s')  || ''
};

var PLANES = ['Azul 1','Azul 2','Azul 3','Plata','Oro','Black','Platino','Diamante'];

/* Abre en Oro: precios razonables con espacio para subir. */
var EST = { plan:'Oro', marca:'Todas', q:'', equipo:null, plazo:24,
            enganche:0, verTodos:false, verCatalogo:false };

function fmx(n){ return '$' + Math.round(n||0).toLocaleString('es-MX'); }
function ini(s){
  var p = String(s||'').trim().split(/\s+/);
  return ((p[0]||'')[0]||'') + ((p[1]||'')[0]||'');
}

function vigente(id){
  var v = (typeof VIGENCY!=='undefined') ? VIGENCY[id] : null;
  return !v || v==='indefinido' || v >= HOY;
}
function renta(p){
  var r=null; (PLANS_DATA||[]).forEach(function(x){ if(x.name===p) r=x.renta; });
  return r;
}
function gb(p){
  var g=null; (PLANS_DATA||[]).forEach(function(x){ if(x.name===p) g=x.gb; });
  return g;
}
function img(id){
  if(typeof IMG==='undefined') return null;
  var v = IMG[id];
  if(typeof v==='string' && v.length<40 && IMG[v]) v = IMG[v];
  return (typeof v==='string' && v.length>60) ? v : null;
}
function tiene3D(id){
  return (typeof MODEL3D!=='undefined') && !!MODEL3D[id];
}

function mensual(id, plan, plazo, eng){
  var pr = PRICES[id];
  if(!pr || !pr.planes[plan]) return null;
  var promo = pr.planes[plan][String(plazo)];
  if(promo===null || promo===undefined) return null;
  return renta(plan) + Math.round(Math.max(0, promo - (eng||0)) / plazo);
}

function mejorPlazo(id, plan){
  var min=null, z=null;
  [24,30,36].forEach(function(p){
    var m = mensual(id, plan, p, 0);
    if(m===null) return;
    if(min===null || m<min){ min=m; z=p; }
  });
  return z===null ? null : { plazo:z, mensual:min };
}

function sinCosto(id, plan){
  var pr=PRICES[id];
  if(!pr || !pr.planes[plan]) return false;
  return [24,30,36].some(function(z){ return pr.planes[plan][String(z)]===0; });
}

function equipos(plan){
  if(typeof CAT==='undefined') return [];
  var out=[];
  Object.keys(CAT).forEach(function(c){
    (CAT[c]||[]).forEach(function(d){
      if(!vigente(d.id) || !PRICES[d.id] || !PRICES[d.id].contado) return;
      if(mejorPlazo(d.id, plan)===null) return;
      out.push(d);
    });
  });
  return out;
}

/* Tope de enganche:
   · descuento < 70%  →  70% del promocional
   · descuento ≥ 70%  →  hasta 3 rentas de garantía
   Nunca por encima del precio del equipo. */
function topeEnganche(id, plan, plazo){
  var pr=PRICES[id];
  if(!pr || !pr.planes[plan]) return 0;
  var promo = pr.planes[plan][String(plazo)];
  if(promo===null || promo===undefined || promo<=0) return 0;
  var desc = (pr.contado - promo) / pr.contado * 100;
  var tope = desc >= 70 ? renta(plan)*3 : promo*0.70;
  return Math.floor(Math.min(tope, promo) / 100) * 100;
}

function pintarPlanes(){
  document.getElementById('planes').innerHTML = PLANES.map(function(p){
    return '<button class="pl'+(EST.plan===p?' on':'')+'" onclick="setPlan(\''+p+'\')">'
      + '<span class="pl-n">'+p+'</span>'
      + '<span class="pl-g">'+(gb(p)||'—')+' GB</span></button>';
  }).join('');
  var act = document.querySelector('.pl.on');
  if(act && act.scrollIntoView) act.scrollIntoView({block:'nearest', inline:'center'});
}

function pintarMarcas(){
  var s={};
  equipos(EST.plan).forEach(function(d){ s[d.brand]=(s[d.brand]||0)+1; });
  var h = '<button class="mk'+(EST.marca==='Todas'?' on':'')+'" onclick="setMarca(\'Todas\')">Todas</button>';
  Object.keys(s).sort(function(a,b){ return s[b]-s[a]; }).forEach(function(m){
    h += '<button class="mk'+(EST.marca===m?' on':'')+'" onclick="setMarca(\''+m+'\')">'
       + m.charAt(0)+m.slice(1).toLowerCase()+'</button>';
  });
  document.getElementById('marcas').innerHTML = h;
}

function tarjeta(d){
  var mp = mejorPlazo(d.id, EST.plan);
  if(!mp) return '';
  var im = img(d.id);
  var free = sinCosto(d.id, EST.plan);
  return '<button class="eq" onclick="abrir(\''+d.id+'\')">'
    + '<span class="eq-img">'
    + (im ? '<img src="'+im+'" alt="" loading="lazy">'
          : '<svg class="ph" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10 18.5h4"/></svg>')
    + (tiene3D(d.id) ? '<span class="tag3d"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/></svg>3D</span>' : '')
    + (free ? '<span class="tag">SIN COSTO</span>' : '')
    + '</span>'
    + '<span class="eq-mk">'+d.brand+'</span>'
    + '<span class="eq-n">'+d.name+'</span>'
    + '<span class="eq-s">'+d.storage+'</span>'
    + '<span class="eq-p"><span class="eq-m">'+fmx(mp.mensual)+'<small>/mes</small></span>'
    + '<span class="eq-e">'+mp.plazo+' meses · plan y equipo</span></span>'
    + '</button>';
}

/* Las tres secciones salen solas de los datos: sin costo = equipos en $0 con
   el plan elegido; ofertas = mayor descuento; nuevos = status NPI. Nadie las
   cura a mano y se actualizan cada vez que cambian los precios. */
function descuento(id, plan){
  var pr=PRICES[id]; if(!pr||!pr.contado||!pr.planes[plan]) return 0;
  var max=0;
  [24,30,36].forEach(function(z){
    var v=pr.planes[plan][String(z)];
    if(v===null||v===undefined) return;
    var d=(pr.contado-v)/pr.contado*100;
    if(d>max) max=d;
  });
  return Math.floor(max);
}

function filaCarrusel(lista, etiqueta){
  return '<div class="fila">' + lista.map(function(d){
    var im=img(d.id), mp=mejorPlazo(d.id, EST.plan);
    if(!mp) return '';
    return '<button class="fx" onclick="abrir(\''+d.id+'\')">'
      + '<span class="fx-img">'+(im?'<img src="'+im+'" alt="" loading="lazy">':'')+'</span>'
      + '<span class="fx-n">'+d.name+'</span>'
      + '<span class="fx-p">'+(etiqueta==='free'
          ? fmx(renta(EST.plan))+'/mes'
          : fmx(mp.mensual)+'/mes')+'</span></button>';
  }).join('') + '</div>';
}

function pintar(){
  var todos = equipos(EST.plan);
  var q = EST.q.toLowerCase().trim();
  var filtrando = (EST.marca!=='Todas' || !!q);

  var lista = todos;
  if(EST.marca!=='Todas') lista = lista.filter(function(d){ return d.brand===EST.marca; });
  if(q) lista = lista.filter(function(d){
    return (d.name+' '+d.brand+' '+d.storage).toLowerCase().indexOf(q) >= 0;
  });

  lista.sort(function(a,b){
    var x=mejorPlazo(a.id,EST.plan), y=mejorPlazo(b.id,EST.plan);
    return (x?x.mensual:9e9)-(y?y.mensual:9e9);
  });

  var h='';

  /* Filtrando o con el catálogo abierto: rejilla directa, sin vitrina. */
  if(filtrando || EST.verCatalogo){
    if(EST.verCatalogo && !filtrando){
      h += '<div class="sec"><h2>Todos los equipos</h2>'
         + '<p>Precios con plan '+EST.plan+'</p></div>';
    } else {
      h += '<div class="sec" style="padding-bottom:4px"></div>';
    }
    h += lista.length
      ? '<div class="grid">'+lista.map(tarjeta).join('')+'</div>'
      : '<div class="vacio">No hay equipos con esa búsqueda.<br>Prueba con otra marca o plan.</div>';
    document.getElementById('cuerpo').innerHTML=h;
    return;
  }

  /* ── Vitrina ── */
  var free = todos.filter(function(d){ return sinCosto(d.id, EST.plan); });
  if(free.length){
    h += '<div class="gratis">'
      + '<div class="gratis-t">'+free.length+' equipos sin costo</div>'
      + '<div class="gratis-s">Con plan '+EST.plan+' solo pagas tu renta mensual</div>'
      + '<div class="gratis-row">'
      + free.slice(0,10).map(function(d){
          var im=img(d.id);
          return '<button class="gr" onclick="abrir(\''+d.id+'\')">'
            + '<span class="gr-img">'+(im?'<img src="'+im+'" alt="" loading="lazy">':'')+'</span>'
            + '<span class="gr-n">'+d.name+'</span>'
            + '<span class="gr-p">'+fmx(renta(EST.plan))+'/mes</span></button>';
        }).join('')
      + '</div></div>';
  }

  var ofertas = todos.filter(function(d){ return !sinCosto(d.id, EST.plan); })
    .sort(function(a,b){ return descuento(b.id,EST.plan)-descuento(a.id,EST.plan); })
    .slice(0,10);
  if(ofertas.length){
    h += '<div class="sec"><h2>Ofertas del momento</h2>'
       + '<p>Los mejores descuentos de esta semana</p></div>'
       + filaCarrusel(ofertas,'oferta');
  }

  var nuevos = todos.filter(function(d){ return d.status==='NPI'; }).slice(0,10);
  if(nuevos.length){
    h += '<div class="sec"><h2>Recién llegados</h2>'
       + '<p>Lo más nuevo del catálogo</p></div>'
       + filaCarrusel(nuevos,'nuevo');
  }

  h += '<button class="vertodo" onclick="abrirCatalogo()">'
    + 'Ver los '+todos.length+' equipos'
    + '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>';

  document.getElementById('cuerpo').innerHTML=h;
}

function abrirCatalogo(){ EST.verCatalogo=true; pintar(); window.scrollTo(0,0); }

function pintarAsesor(){
  var el = document.getElementById('asesor');
  if(!ASESOR.nombre && !ASESOR.tel){ el.style.display='none'; return; }
  el.innerHTML = '<div class="asesor-in"><span class="av">'+ini(ASESOR.nombre)+'</span>'
    + '<span class="asesor-b"><span class="asesor-n">'+(ASESOR.nombre||'Tu asesor')+'</span>'
    + '<span class="asesor-s">Te asesora sin costo</span></span>'
    + '<button class="wa" onclick="escribir()">'
    + '<svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5 0-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1.1 2.8 1.2 3c.2.2 2.1 3.2 5 4.5.7.3 1.3.5 1.7.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.2-.3-.2-.6-.4z"/><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>'
    + 'Escribir</button></div>';
}

function abrir(id){
  var d=null;
  Object.keys(CAT).forEach(function(c){ (CAT[c]||[]).forEach(function(x){ if(x.id===id) d=x; }); });
  if(!d) return;
  var mp = mejorPlazo(id, EST.plan);
  EST.equipo=d; EST.plazo = mp ? mp.plazo : 24; EST.enganche=0; EST.verTodos=false;
  pintarDetalle();
  document.getElementById('det').classList.add('open');
  document.body.style.overflow='hidden';
  window.scrollTo(0,0);
  history.pushState({det:1},'','#'+id);
}
function cerrarDetalle(){
  document.getElementById('det').classList.remove('open');
  document.body.style.overflow=''; EST.equipo=null;
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
}

/* Solo los planes vecinos: ver los ocho de golpe es lo que empujaba al
   cliente al más barato. */
function planesVecinos(){
  var d=EST.equipo;
  var con = PLANES.filter(function(p){ return mensual(d.id,p,EST.plazo,0)!==null; });
  if(EST.verTodos) return con.filter(function(p){ return p!==EST.plan; });
  var i = con.indexOf(EST.plan);
  return con.slice(Math.max(0,i-1), i+2).filter(function(p){ return p!==EST.plan; });
}

function pintarDetalle(){
  var d=EST.equipo; if(!d) return;
  var im = img(d.id);
  var m = mensual(d.id, EST.plan, EST.plazo, EST.enganche);
  var free = sinCosto(d.id, EST.plan);

  var h = '<div class="det-top">'
    + '<button class="volver" onclick="cerrarDetalle()">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Volver</button>'
    + '<div class="det-img">'
    + (im ? '<img src="'+im+'" alt="">' : '<svg class="ph" viewBox="0 0 24 24" fill="none" stroke-width="1.4" style="width:44px;height:44px;stroke:var(--ink4)"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/></svg>')
    + '</div>'
    + '<div class="det-mk">'+d.brand+'</div>'
    + '<div class="det-n">'+d.name+'</div>'
    + '<div class="det-s">'+d.storage+'</div>'
    + (tiene3D(d.id) ? '<button class="ver3d" onclick="ver3D()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/></svg>Verlo en 3D</button>' : '')
    + '</div>';

  h += '<div class="blq"><div class="precio">'
    + '<div class="precio-top"><span class="precio-pl">Plan '+EST.plan+'</span>'
    + '<span class="precio-gb">'+(gb(EST.plan)||'—')+' GB</span></div>'
    + '<div class="precio-v">'+fmx(m)+'<small>/mes</small></div>'
    + '<div class="precio-d">a '+EST.plazo+' meses · incluye plan y equipo</div>'
    + (free ? '<div class="sello">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
        + 'Equipo sin costo · solo pagas tu plan</div>' : '')
    + '</div></div>';

  var vec = planesVecinos();
  if(vec.length){
    h += '<div class="blq"><div class="lbl">OTROS PLANES</div><div class="otros">'
      + vec.map(function(p){
          var mm = mensual(d.id,p,EST.plazo,EST.enganche);
          return '<button class="otro" onclick="setPlan(\''+p+'\',1)">'
            + '<span class="otro-n">'+p+'</span>'
            + '<span class="otro-g">'+(gb(p)||'—')+' GB</span>'
            + '<span class="otro-m">'+fmx(mm)+'</span></button>';
        }).join('')
      + '</div>'
      + (!EST.verTodos ? '<button class="mas" onclick="verTodosPlanes()">Ver todos los planes</button>' : '')
      + '</div>';
  }

  var plz = [24,30,36].filter(function(z){ return mensual(d.id,EST.plan,z,0)!==null; });
  if(plz.length>1){
    h += '<div class="blq"><div class="lbl">PLAZO</div><div style="display:flex;gap:7px">'
      + plz.map(function(z){
          return '<button class="pl'+(EST.plazo===z?' on':'')+'" style="flex:1" onclick="setPlazo('+z+')">'
            + '<span class="pl-n">'+z+'</span><span class="pl-g">meses</span></button>';
        }).join('') + '</div></div>';
  }

  var tope = topeEnganche(d.id, EST.plan, EST.plazo);
  if(EST.enganche>tope) EST.enganche=tope;
  if(tope>0){
    h += '<div class="blq"><div class="lbl">SIMULA TU PAGO INICIAL</div><div class="sim">'
      + '<div class="sim-top"><span class="sim-l">Pago inicial</span>'
      + '<span class="sim-v" id="eng-v">'+fmx(EST.enganche)+'</span></div>'
      + '<input type="range" id="eng" min="0" max="'+tope+'" step="100" value="'+EST.enganche+'">'
      + '<div class="sim-lim"><span>$0</span><span>'+fmx(tope)+'</span></div>'
      + '<div class="sim-out"><span>Pagarías al mes</span><b id="mes-v">'+fmx(m)+'</b></div>'
      + '</div></div>';
  }

  if(typeof PLAN_BENEFITS!=='undefined'){
    h += '<div class="blq"><div class="lbl">TU PLAN INCLUYE</div><div class="incl"><div class="chips">'
      + '<span class="chip">'+PLAN_BENEFITS.redes+'</span>'
      + '<span class="chip">'+PLAN_BENEFITS.minutos+'</span>'
      + (PLAN_BENEFITS.extras||[]).map(function(x){ return '<span class="chip">'+x+'</span>'; }).join('')
      + '</div></div></div>';
  }

  h += '<div class="nota"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
    + '<span>Montos estimados. El pago inicial y la mensualidad finales dependen de tu evaluación crediticia.</span></div>';

  h += '<button class="cta" onclick="meInteresa()">'
    + '<svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5 0-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1.1 2.8 1.2 3c.2.2 2.1 3.2 5 4.5.7.3 1.3.5 1.7.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.2-.3-.2-.6-.4z"/><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>'
    + 'Me interesa, contáctame</button>';

  /* Sin fecha: las vigencias cambian cada semana y una fecha envejece mal. */
  h += '<div class="pie">Precios sujetos a vigencia · consulta con tu asesor<br>'
    + 'Sujeto a aprobación crediticia</div>';

  document.getElementById('det-in').innerHTML = h;

  var sl = document.getElementById('eng');
  if(sl) sl.addEventListener('input', function(e){
    EST.enganche = Number(e.target.value);
    refrescarSim();
  });
}

/* Mover el deslizante no repinta: destruiría el control a media interacción. */
function refrescarSim(){
  var d=EST.equipo; if(!d) return;
  var m = mensual(d.id, EST.plan, EST.plazo, EST.enganche);
  var a=document.getElementById('eng-v'); if(a) a.textContent=fmx(EST.enganche);
  var b=document.getElementById('mes-v'); if(b) b.textContent=fmx(m);
  var pv=document.querySelector('.precio-v');
  if(pv) pv.innerHTML = fmx(m)+'<small>/mes</small>';
  var vec=planesVecinos();
  document.querySelectorAll('.otro').forEach(function(el,i){
    if(!vec[i]) return;
    var x=el.querySelector('.otro-m');
    if(x) x.textContent = fmx(mensual(d.id,vec[i],EST.plazo,EST.enganche));
  });
}

/* ── Compartir: menú nativo, no WhatsApp forzado ──────────────────────── */

function compartir(texto){
  /* [v1.14] Antes se abría wa.me directo y el teléfono obligaba a WhatsApp
     Business. navigator.share deja que el usuario elija su app. */
  if(navigator.share){
    navigator.share({ text:texto }).catch(function(){});
    return;
  }
  window.open('https://wa.me/'+(ASESOR.tel||'')+'?text='+encodeURIComponent(texto),
              '_blank', 'noopener');
}

function escribir(){
  compartir('Hola'+(ASESOR.nombre?' '+ASESOR.nombre.split(' ')[0]:'')
    + ', vi el catálogo y me interesa conocer más opciones.');
}

function meInteresa(){
  var d=EST.equipo; if(!d) return;
  var m = mensual(d.id, EST.plan, EST.plazo, EST.enganche);
  compartir('Hola'+(ASESOR.nombre?' '+ASESOR.nombre.split(' ')[0]:'')+', me interesa esta opción:\n\n'
    + d.name+' '+d.storage+'\n\n'
    + 'Plan AT&T '+EST.plan+' · '+EST.plazo+' meses\n'
    + 'Pago inicial estimado '+fmx(EST.enganche)+'\n'
    + 'Mensualidad estimada '+fmx(m)+'\n\n¿Cómo seguimos?');
}

/* [v1.14.1] Antes mandaba a index.html — o sea, a la app de colaboradores.
   El cliente no tiene por qué salir del catálogo: el visor se abre aquí
   mismo con model-viewer, igual que en la ficha interna. */
function ver3D(){
  var d=EST.equipo; if(!d) return;
  var m = (typeof MODEL3D!=='undefined') ? MODEL3D[d.id] : null;
  if(typeof m==='string' && MODEL3D[m]) m = MODEL3D[m];   // alias
  if(!m || !m.src) return;

  var cap = document.createElement('div');
  cap.className='v3d';
  cap.innerHTML = '<button class="v3d-x" onclick="cerrar3D()" aria-label="Cerrar">&#10005;</button>'
    + '<model-viewer src="'+m.src+'"'
    + (m.ios ? ' ios-src="'+m.ios+'"' : '')
    + ' alt="'+d.name+'" camera-controls auto-rotate ar'
    + ' ar-modes="webxr scene-viewer quick-look" shadow-intensity="1"'
    + ' style="width:100%;height:100%;background:#F1F3F6"></model-viewer>'
    + (m.by ? '<div class="v3d-by">Modelo 3D por '+m.by+'</div>' : '');
  document.body.appendChild(cap);

  if(!window._mvCargado){
    var s=document.createElement('script');
    s.type='module';
    s.src='https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js';
    document.head.appendChild(s);
    window._mvCargado=true;
  }
}

function cerrar3D(){
  var c=document.querySelector('.v3d');
  if(!c) return;
  /* Liberar la memoria de GPU antes de quitar el nodo: si no, el visor
     deja texturas colgadas y el teléfono se pone lento. */
  var mv=c.querySelector('model-viewer');
  if(mv) mv.removeAttribute('src');
  c.remove();
}

function setPlan(p, dentro){
  EST.plan=p;
  pintarPlanes(); pintarMarcas(); pintar();
  if(dentro && EST.equipo){
    var mp=mejorPlazo(EST.equipo.id, p);
    if(mp) EST.plazo=mp.plazo;
    EST.enganche=0;
    pintarDetalle();
  } else {
    window.scrollTo(0,0);
  }
}
function setMarca(m){
  EST.marca=m;
  if(m==='Todas') EST.verCatalogo=false;   // volver a la vitrina
  pintarMarcas(); pintar(); window.scrollTo(0,0);
}
function setPlazo(z){ EST.plazo=z; EST.enganche=0; pintarDetalle(); }
function verTodosPlanes(){ EST.verTodos=true; pintarDetalle(); }
function limpiar(){
  EST.q=''; document.getElementById('q').value='';
  document.getElementById('qx').classList.remove('on'); pintar();
}

document.getElementById('q').addEventListener('input', function(e){
  EST.q=e.target.value;
  document.getElementById('qx').classList.toggle('on', !!EST.q);
  pintar();
});
window.addEventListener('popstate', function(){ if(EST.equipo) cerrarDetalle(); });

function iniciar(){
  if(typeof CAT==='undefined'){
    document.getElementById('cuerpo').innerHTML =
      '<div class="vacio">No pudimos cargar el catálogo.<br>Revisa tu conexión.</div>';
    return;
  }
  pintarPlanes(); pintarMarcas(); pintar(); pintarAsesor();
}

/* catalog-img.js avisa al terminar: repintar para que salgan las fotos. */
window._onCatalogImgReady = function(){ if(typeof CAT!=='undefined') pintar(); };
iniciar();
</script>
