     tableros los leen de ahí. Antes cada tablero traía su propia copia. -->

<title>Cuotas semanales — TechGuide</title>
<script src="comisiones2026.js"></script>
<style>
:root{
  --bg:#080D16;--surface:#0F1622;--surface2:#16202E;--surface3:#1F2B3C;
  --label:#EDF2F8;--label2:#D7E0EB;--label3:#8A97A9;--label4:#414E5F;
  --sep:rgba(237,242,248,0.10);
  --blue:#31A5E5;--cyan:#4DB4EC;--green:#30D158;--mint:#3BC292;
  --red:#FF453A;--red-soft:#FF8A80;--amber:#FFD60A;
  --r-xl:22px;--r-lg:16px;--r-md:12px;
  --att-blue:#31A5E5;--att-cyan:#4DB4EC;
  --pmd-accent:#31A5E5;--pmd-navy:#13203E;--pmd-danger:#FF453A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.phone{width:100%;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:560px;margin:0 auto;width:100%;padding-bottom:120px}

.nav{position:sticky;top:0;z-index:40;background:rgba(8,13,22,.92);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep);
  display:flex;align-items:center;gap:8px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top))}
.nav-back{background:none;border:none;color:var(--blue);font-size:15px;
  font-family:inherit;display:flex;align-items:center;padding:0;cursor:pointer}
.nav-t{flex:1;font-size:16px;font-weight:600;letter-spacing:-.02em}
.pad{padding:14px 16px}

.sel{background:var(--surface);border:1px solid var(--sep);border-radius:var(--r-lg);
  padding:12px 14px;margin-bottom:12px}
.sel-l{color:var(--label3);font-size:10px;letter-spacing:.7px;margin-bottom:7px}
.sel-row{display:flex;gap:8px}
select{flex:1;background:var(--surface2);border:1px solid var(--sep);border-radius:10px;
  color:var(--label);font-size:14px;font-family:inherit;padding:9px 11px;
  -webkit-appearance:none;appearance:none;cursor:pointer}
select:focus{outline:none;border-color:var(--blue)}

.sec-t{color:var(--label3);font-size:10px;letter-spacing:.7px;margin:18px 2px 9px}
.q{background:var(--surface2);border-radius:var(--r-md);padding:12px 13px;margin-bottom:7px}
.q-row{display:flex;align-items:center;gap:12px}
.q-n{flex:1;min-width:0}
.q-nn{color:var(--label);font-size:13.5px;font-weight:600}
.q-ns{color:var(--label3);font-size:10px;margin-top:2px}
input[type=number]{width:92px;background:var(--surface);border:1px solid var(--sep);
  border-radius:10px;color:var(--label);font-size:17px;font-weight:700;font-family:inherit;
  padding:9px 10px;text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]:focus{outline:none;border-color:var(--blue)}
input[type=number]:disabled{opacity:.45;cursor:not-allowed}
.q-by{margin-top:9px;padding-top:8px;border-top:1px solid rgba(237,242,248,.07);
  display:flex;align-items:center;gap:6px;color:var(--label3);font-size:9.5px}
.q-by svg{width:11px;height:11px;flex-shrink:0}
.q-by.lock{color:var(--amber)}
.q-by.lock svg{stroke:var(--amber)}

.aviso{background:rgba(255,214,10,.1);border-radius:var(--r-md);padding:11px 13px;
  display:flex;gap:9px;align-items:flex-start;font-size:11px;line-height:1.45;
  color:var(--amber);margin-top:12px}
.aviso svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(8,13,22,.94);backdrop-filter:blur(20px);
  border-top:1px solid var(--sep);padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.barra-in{max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:center}
.btn{flex:1;background:var(--blue);color:#fff;border:none;border-radius:14px;
  padding:13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active{opacity:.8}
.estado{color:var(--label3);font-size:11px;text-align:center;margin-top:8px}
.estado.ok{color:var(--mint)}
.estado.err{color:var(--red-soft)}
.tienda-chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--cyan);
  margin-bottom:12px}
.tienda-chip svg{width:14px;height:14px}
.weeks{display:flex;gap:7px;padding:2px 2px 4px;overflow-x:auto;margin-bottom:14px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;border:none;cursor:pointer;font-family:inherit;background:var(--surface);
  color:var(--label3);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;
  transition:.18s}
.wk small{display:block;font-size:9px;font-weight:600;opacity:.7;letter-spacing:.4px;
  text-transform:uppercase}
.wk.on{background:var(--blue);color:#fff}
.copiar{width:100%;margin-top:14px;background:var(--surface);border:1px solid var(--sep);
  border-radius:var(--r-md);padding:11px;color:var(--cyan);font-size:12.5px;font-weight:600;
  font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.copiar:active{opacity:.7}
.copiar svg{width:15px;height:15px}
.empty{text-align:center;padding:40px 20px;color:var(--label3);font-size:13px;line-height:1.6}

/* ── Drawer compartido (antes en comisiones-ui.css; inline para que el
      tablero no dependa de un archivo externo que puede no resolver) ── */
/* ============================================================================
   comisiones-ui.css — [v1.12.3] UI compartida de los 5 tableros de comisiones.
   ANTES: cada comisiones-*.html traía su propia copia de este bloque (drawer
   pmd-*). Ahora es una sola fuente; los tableros lo enlazan con <link>.
   Nota: usa alias --pmd-* porque los tokens difieren entre tableros
   (ejecutivo: --att-blue · mandos: --blue). También corrige que en los mandos
   var(--att-blue) no existía y el avatar/switch quedaban sin fondo.
   ========================================================================== */
:root{--pmd-accent:#31A5E5;--pmd-navy:#101A30;--pmd-danger:#FF453A}
:root[data-theme="light"]{--pmd-accent:#0E7DBE;--pmd-navy:#13203E;--pmd-danger:#D0291C}

.pmd-overlay{position:fixed;inset:0;z-index:1200;background:rgba(9,13,22,.44);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .26s cubic-bezier(.32,.72,0,1),visibility .26s}
.pmd-overlay.on{opacity:1;visibility:visible}
.pmd-drawer{position:fixed;top:0;left:0;bottom:0;z-index:1201;width:84%;max-width:328px;background:var(--surface);box-shadow:0 18px 60px rgba(0,0,0,.5);transform:translateX(-102%);transition:transform .28s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
.pmd-drawer.on{transform:none}
.pmd-head{padding:22px 20px 18px;display:flex;align-items:center;gap:13px;width:100%;background:transparent;border:none;border-bottom:1px solid var(--sep);cursor:pointer;font-family:inherit;text-align:left;transition:background .16s ease}
.pmd-head:hover{background:var(--surface2)}
.pmd-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--pmd-navy);color:#fff;font-weight:700;font-size:17px;flex-shrink:0;letter-spacing:.02em}
.pmd-who b{display:block;font-size:16px;font-weight:800;color:var(--label);letter-spacing:-.01em}
.pmd-who span{display:block;font-size:12.5px;color:var(--label3);margin-top:2px;font-weight:500}
.pmd-head-chev{width:18px;height:18px;color:var(--label3);flex-shrink:0;margin-left:auto}
.pmd-nav{padding:10px 12px 12px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
.pmd-item{display:flex;align-items:center;gap:13px;padding:12px 13px;border-radius:10px;background:transparent;border:none;color:var(--label);font-size:14.5px;font-weight:600;letter-spacing:-.01em;width:100%;text-align:left;cursor:pointer;font-family:inherit;transition:background .16s ease,transform .1s ease}
.pmd-item svg{width:19px;height:19px;color:var(--label3);flex-shrink:0;stroke-width:1.9;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;transition:color .16s ease}
.pmd-item:hover{background:var(--surface2)}
.pmd-item:hover svg{color:var(--label)}
.pmd-item:active{transform:scale(.98)}
.pmd-item:focus-visible{outline:2px solid var(--pmd-accent);outline-offset:2px}
.pmd-sep{height:1px;background:var(--sep);margin:10px 14px}
.pmd-danger{color:var(--pmd-danger)} .pmd-danger svg{color:var(--pmd-danger)}
.pmd-switch{width:38px;height:22px;border-radius:999px;background:var(--sep);position:relative;transition:background .2s ease;flex-shrink:0}
.pmd-switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s ease}
.pmd-switch.on{background:var(--pmd-accent)}
.pmd-switch.on::after{transform:translateX(16px)}
.pmd-foot{padding:14px 22px calc(16px + env(safe-area-inset-bottom,0));font-size:11px;color:var(--label3);border-top:1px solid var(--sep);font-weight:600}
.pmd-foot b{font-weight:800;color:var(--label)} .pmd-foot b span{color:var(--pmd-accent)}

</style>
</head>
<body>
<div class="phone">
<div class="wrap">
  <div class="nav">
    <button class="nav-back" onclick="history.length>1?history.back():location.href='index.html'" aria-label="Volver">
      <svg viewBox="0 0 9 15" width="8" height="14" fill="none"><path d="M7.5 1L1 7.5 7.5 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="nav-t">Cuotas y ARPU</span>
  </div>

  <div class="pad" id="cuerpo">
    <div class="empty">Cargando…</div>
  </div>
</div>

<div class="barra" id="barra" style="display:none">
  <div class="barra-in">
    <button class="btn" id="btn-guardar" onclick="guardar()">Guardar</button>
  </div>
  <div class="estado" id="estado"></div>
</div>

<script>
/* ══ CAPTURA DE CUOTAS Y ARPU · 2026 ══════════════════════════════════════
   El gerente fija las cuotas de su tienda; el regional puede sobrescribirlas.
   Gana la jerarquía, no quien escribió al final — si el regional ya fijó un
   valor, el gerente lo ve bloqueado en vez de pisarlo sin querer.
   ═════════════════════════════════════════════════════════════════════════ */

var ASESOR=null;
try{ ASESOR=JSON.parse(localStorage.getItem('primemx_sesion_v1')||'null'); }catch(e){}

var JER = { asesor:0, gerente:1, regional:2, director:3, director_nacional:4 };

var CAMPOS=[
  {k:'equipo',n:'Equipo'},{k:'servicio',n:'Servicio'},{k:'renovacion',n:'Renovación'},
  {k:'accesorios',n:'Accesorios'},{k:'seguros',n:'Seguros'},{k:'prepago',n:'Prepago'}
];
/* El ARPU salió de aquí: no se captura, se calcula de las ventas
   (calcularARPU2026) y los mínimos son fijos: $700 con equipo, $400 servicio. */

var EST={ tienda:'', mes:'', doc:null, tiendas:[], miRol:'gerente', sucio:false };

function bonito(id){
  return String(id).replace(/^prm[-_]/i,'').replace(/[-_]+/g,' ')
    .replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

function miNivel(){ return JER[String(EST.miRol||'').toLowerCase()] || 0; }

/* ¿Puedo editar este campo? Solo si nadie de jerarquía mayor lo fijó. */
function puedoEditar(reg){
  if(!reg || !reg.rol) return true;
  return (JER[String(reg.rol).toLowerCase()]||0) <= miNivel();
}

/* Semana ISO — mismo formato que ya usan las ventas: 2026-W32. */
function isoWeek(d){
  d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  var ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-ys)/86400000)+1)/7);
}
function isoYear(d){
  d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  return d.getUTCFullYear();
}
function periodoDe(d){ return isoYear(d)+'-W'+String(isoWeek(d)).padStart(2,'0'); }

/* Lunes y domingo de esa semana, para mostrar el rango real. Sirve además
   para las semanas recortadas de fin de mes. */
function rangoSemana(d){
  var l=new Date(d); l.setDate(l.getDate()-((l.getDay()||7)-1)); l.setHours(0,0,0,0);
  var f=new Date(l); f.setDate(f.getDate()+6);
  var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return l.getDate()+' '+M[l.getMonth()]+' – '+f.getDate()+' '+M[f.getMonth()];
}

/* Barra de semanas con scroll horizontal, igual que el tablero de ventas.
   Seis atrás y una adelante: alcanza para corregir lo pasado y dejar lista
   la que viene. La actual arranca seleccionada. */
function semanasChips(){
  var h=new Date(), o='';
  for(var i=-6;i<=1;i++){
    var d=new Date(h); d.setDate(d.getDate()+i*7);
    var v=periodoDe(d);
    o+='<button class="wk'+(v===EST.mes?' on':'')+'" onclick="irSemana(\''+v+'\')">'
      +'<small>Sem</small>'+isoWeek(d)+'</button>';
  }
  return o;
}

function irSemana(v){
  if(EST.sucio && !confirm('Tienes cambios sin guardar. ¿Cambiar de semana?')) return;
  EST.mes=v; EST.sucio=false; cargar();
  setTimeout(centrarSemana, 30);
}

/* La semana activa suele quedar fuera de vista al abrir; se centra sola. */
function centrarSemana(){
  var w=document.getElementById('weeks');
  var a=w && w.querySelector('.wk.on');
  if(w && a) w.scrollLeft = a.offsetLeft - (w.clientWidth/2) + (a.offsetWidth/2);
}

function pintar(){
  var h='';

  if(EST.ajena){
    h+='<div class="tienda-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l2-5h14l2 5M4 9v11a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9M3 9h18M9 21v-6h6v6"/></svg>'
      +bonito(EST.tienda)+'</div>';
  }
  h+='<div class="weeks" id="weeks">'+semanasChips()+'</div>';

  var d=EST.doc||{};
  var m=d.metricas||{};

  h+='<div class="sec-t">CUOTA POR MÉTRICA</div>';
  CAMPOS.forEach(function(c){
    var reg=m[c.k]||null;
    var val=reg&&reg.valor!==undefined?reg.valor:'';
    var edit=puedoEditar(reg);
    h+='<div class="q"><div class="q-row"><div class="q-n">'
      +'<div class="q-nn">'+c.n+'</div></div>'
      +'<input type="number" min="0" step="1" id="in-'+c.k+'" value="'+val+'" '
      +'placeholder="0" '+(edit?'':'disabled')+' oninput="marcarSucio()"></div>';
    if(reg&&reg.por){
      h+='<div class="q-by'+(edit?'':' lock')+'">'
        +(edit
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>')
        +'Fijada por '+reg.por+' ('+reg.rol+')'
        +(edit?'':' — no puedes sobrescribirla')+'</div>';
    }
    h+='</div>';
  });

  h+='<button class="copiar" onclick="copiarAnterior()">'
    +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
    +'Copiar de la semana anterior</button>';

  document.getElementById('cuerpo').innerHTML=h;
  document.getElementById('barra').style.display='block';
  centrarSemana();
}

/* Casi siempre la cuota se repite semana a semana; esto evita recapturar seis
   campos. Respeta el candado: no pisa lo que fijó un mando superior. */
async function copiarAnterior(){
  var e=document.getElementById('estado');
  var partes=EST.mes.split('-W');
  var d=new Date(); d.setDate(d.getDate()-7);
  // Reconstruir la semana anterior a la seleccionada
  var y=Number(partes[0]), w=Number(partes[1])-1;
  if(w<1){ y-=1; w=52; }
  var previo=y+'-W'+String(w).padStart(2,'0');
  e.textContent='Buscando la semana '+w+'…'; e.className='estado';
  try{
    var doc=await TG_FB.loadCuotas(EST.tienda, previo);
    if(!doc || !doc.metricas || !Object.keys(doc.metricas).length){
      e.textContent='La semana '+w+' no tiene cuotas capturadas.'; e.className='estado err'; return;
    }
    CAMPOS.forEach(function(c){
      var el=document.getElementById('in-'+c.k);
      var reg=doc.metricas[c.k];
      if(el && !el.disabled && reg && reg.valor!==undefined) el.value=reg.valor;
    });
    EST.sucio=true;
    e.textContent='Copiado de la semana '+w+'. Revisa y guarda.'; e.className='estado ok';
  }catch(err){
    console.error('copiarAnterior', err);
    e.textContent='No se pudo leer la semana anterior.'; e.className='estado err';
  }
}

function marcarSucio(){
  EST.sucio=true;
  document.getElementById('estado').textContent='';
  document.getElementById('estado').className='estado';
}

function leerFormulario(){
  var yo = (ASESOR&&(ASESOR.nombre||ASESOR.attuid)) || 'desconocido';
  var rol = String(EST.miRol||'gerente').toLowerCase();
  var d = EST.doc || {};
  var metricas = Object.assign({}, d.metricas||{});
  var arpu = Object.assign({}, d.arpu||{});
  var ahora = new Date().toISOString();

  /* La validación de jerarquía va AQUÍ, no en el atributo disabled del input:
     ese solo es una pista visual y cualquiera puede quitarlo desde el
     inspector. Si un valor lo fijó alguien de nivel mayor, se descarta el
     cambio y se conserva el original. */
  function aplicar(destino, prefijo, lista){
    var rechazados=[];
    lista.forEach(function(c){
      var el=document.getElementById(prefijo+c.k);
      if(!el) return;
      var v = el.value==='' ? null : Number(el.value);
      if(v===null || !isFinite(v) || v<0) return;
      var previo=destino[c.k];
      if(previo && !puedoEditar(previo)){
        if(Number(previo.valor)!==v) rechazados.push(c.n);
        return;                                   // se conserva el original
      }
      if(previo && Number(previo.valor)===v) return;   // sin cambio real
      destino[c.k]={ valor:v, rol:rol, por:yo, ts:ahora };
    });
    return rechazados;
  }
  var rech = aplicar(metricas,'in-',CAMPOS);
  return { metricas:metricas, arpu:arpu, rechazados:rech };
}

async function guardar(){
  var b=document.getElementById('btn-guardar');
  var e=document.getElementById('estado');
  if(!window.TG_FB || !TG_FB.saveCuotas){
    e.textContent='No hay conexión con la base de datos.'; e.className='estado err'; return;
  }
  b.disabled=true; e.textContent='Guardando…'; e.className='estado';
  try{
    var datos=leerFormulario();
    await TG_FB.saveCuotas(EST.tienda, EST.mes,
                           {metricas:datos.metricas, arpu:datos.arpu});
    EST.doc={metricas:datos.metricas, arpu:datos.arpu};
    EST.sucio=false;
    if(datos.rechazados.length){
      e.textContent='Guardado. No se cambió '+datos.rechazados.join(', ')
        +': lo fijó un mando superior.';
      e.className='estado err';
    } else {
      e.textContent='Cuotas guardadas'; e.className='estado ok';
    }
    pintar();
  }catch(err){
    console.error('guardar', err);
    e.textContent='No se pudo guardar. Revisa tu conexión.'; e.className='estado err';
  }
  b.disabled=false;
}

async function cargar(){
  if(!window.TG_FB || !TG_FB.loadCuotas) return;
  try{
    EST.doc = await TG_FB.loadCuotas(EST.tienda, EST.mes);
  }catch(e){ console.error('cargar', e); EST.doc=null; }
  pintar();
}


window.addEventListener('beforeunload', function(ev){
  if(EST.sucio){ ev.preventDefault(); ev.returnValue=''; }
});

window.bootCuotas = async function(){
  if(!ASESOR){
    document.getElementById('cuerpo').innerHTML='<div class="empty">'
      +'No encontramos tu sesión.<br><br><span style="font-size:12px">'
      +'Entra desde TechGuide en vez de abrir esta página directo.</span></div>';
    return;
  }
  EST.miRol = ASESOR.rol || 'gerente';
  if(miNivel() < JER.gerente){
    document.getElementById('cuerpo').innerHTML='<div class="empty">'
      +'Solo gerentes y mandos superiores pueden capturar cuotas.</div>';
    return;
  }
  /* El regional llega desde el drill de una tienda: ?t=tienda&p=semana.
     El gerente entra sin parámetros y usa la suya. */
  var qs = new URLSearchParams(location.search);
  var tParam = qs.get('t'), pParam = qs.get('p');
  EST.mes = pParam || periodoDe(new Date());
  EST.tienda = tParam || ASESOR.tienda || ASESOR.sucursal || '';
  EST.ajena = !!(tParam && tParam !== (ASESOR.tienda||ASESOR.sucursal));
  if(!EST.tienda){
    document.getElementById('cuerpo').innerHTML='<div class="empty">'
      +'Tu perfil no tiene tienda asignada.</div>';
    return;
  }
  await cargar();
};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, setDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC9qhK78TKkLUu_gcN3WRwyKV8-mTk1Lsc",authDomain:"techguide-primemx.firebaseapp.com",projectId:"techguide-primemx",storageBucket:"techguide-primemx.firebasestorage.app"};
const db=getFirestore(initializeApp(cfg));

window.TG_FB={
  /* [2026] El documento pasa de {cuota:25} a seis métricas + ARPU, cada una
     con su autoría {valor, rol, por, ts}. Se conserva `cuota` plano para que
     los tableros viejos no truenen mientras migran. */
  async loadCuotas(tienda, mes){
    try{
      const s=await getDoc(doc(db,'comisiones_cuotas',tienda+'__'+mes));
      if(!s.exists()) return null;
      const d=s.data();
      // Migración al vuelo: si solo hay el número viejo, se lee como 'equipo'.
      if(!d.metricas && typeof d.cuota==='number'){
        return { metricas:{ equipo:{ valor:d.cuota, rol:'gerente', por:d.by||'—', ts:'' } },
                 arpu:{}, _legacy:true };
      }
      return { metricas:d.metricas||{}, arpu:d.arpu||{} };
    }catch(e){ console.error('loadCuotas',e); return null; }
  },

  async saveCuotas(tienda, mes, datos){
    const payload={ tienda, mes, metricas:datos.metricas||{}, arpu:datos.arpu||{},
                    ts:serverTimestamp() };
    // Espejo del valor de equipo en `cuota` para compatibilidad hacia atrás.
    const eq=datos.metricas && datos.metricas.equipo;
    if(eq && eq.valor!==undefined) payload.cuota=eq.valor;
    await setDoc(doc(db,'comisiones_cuotas',tienda+'__'+mes), payload, {merge:true});
  },

  async listarTiendas(region){
    const out=[], vistas={};
    try{
      const q = region
        ? query(collection(db,'empleados'), where('region','==',region))
        : query(collection(db,'empleados'));
      const snap=await getDocs(q);
      snap.forEach(function(d){
        const o=d.data();
        if(o && o.tienda && !vistas[o.tienda]){
          vistas[o.tienda]=1;
          out.push({ id:o.tienda, nombre:_bonito(o.tienda) });
        }
      });
    }catch(e){ console.error('listarTiendas',e); }
    out.sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
    return out;
  }
};

function _bonito(id){
  return String(id).replace(/[-_]+/g,' ')
    .replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

if(window.bootCuotas) window.bootCuotas();
</script>

<script>
/* ── Menú lateral (drawer) — portado del home v1.11.47 ── */
(function(){
  var d=document.getElementById('pmd-drawer'), ov=document.getElementById('pmd-overlay');
  if(!d||!ov) return;
  function pmdCuotasVisible(){
    /* La entrada de cuotas solo existe para gerente en adelante. */
    try{
      var s=JSON.parse(localStorage.getItem('primemx_sesion_v1')||'null');
      var J={gerente:1,regional:2,director:3,director_nacional:4};
      var el=document.getElementById('pmd-cuotas');
      if(el && s && J[String(s.rol||'').toLowerCase()]) el.style.display='';
    }catch(e){}
  }
  function pmdSes(){try{return JSON.parse(localStorage.getItem('primemx_sesion_v1')||'null');}catch(e){return null;}}
  window.pmdOpen=function(){ pmdCuotasVisible();
    try{
      var s=pmdSes();
      if(s&&s.attuid){
        var nm=s.name||s.nombre||'Asesor';
        var eN=document.getElementById('pmd-name'); if(eN)eN.textContent=nm;
        var eR=document.getElementById('pmd-role');
        if(eR){var r=String(s.rol||'asesor'); var reg=s.region?(' · '+s.region):''; eR.textContent=r.charAt(0).toUpperCase()+r.slice(1)+reg;}
        var eA=document.getElementById('pmd-avatar');
        if(eA){var p=String(nm).trim().split(/\s+/); eA.textContent=(((p[0]||'')[0]||'')+((p[1]||'')[0]||''))||(String(nm)[0]||'P');}
        var acc=document.getElementById('pmd-accesos');
        if(acc){var rl=String(s.rol||'').toLowerCase();acc.style.display=(s.attuid==='DC499W'||['regional','director','director_nacional'].indexOf(rl)>=0)?'flex':'none';}
      }
    }catch(e){}
    if(window.pmdSyncTheme)pmdSyncTheme(); if(window.pmdSyncDesktop)pmdSyncDesktop();
    d.classList.add('on'); ov.classList.add('on'); document.body.style.overflow='hidden';
  };
  window.pmdClose=function(){ d.classList.remove('on'); ov.classList.remove('on'); document.body.style.overflow=''; };
  window.pmdSyncTheme=function(){ var sw=document.getElementById('pmd-theme-sw'); if(!sw)return; sw.classList.toggle('on',document.documentElement.getAttribute('data-theme')!=='light'); };
  window.pmdGo=function(a){
    var go=function(url){ pmdClose(); setTimeout(function(){ location.href=url; },160); };
    switch(a){
      case 'inicio':  go('index.html'); break;
      case 'momento': go('index.html#momento'); break;
      case 'topcomm': go('index.html#topcomm'); break;
      case 'comisiones': pmdClose(); break;
      case 'cuotas': go('comisiones-cuotas.html'); break;
      case 'dash':    go('index.html#actividad'); break;
      case 'calc':    go('index.html#calc'); break;
      case 'diag':    go('index.html#diag'); break;
      case 'accesos': go('index.html#accesos'); break;
      case 'perfil':  go('index.html#perfil'); break;
      case 'refresh': pmdClose(); setTimeout(function(){ if(typeof refreshDash==='function')refreshDash(); },220); break;
      case 'logout':  pmdClose(); setTimeout(function(){ if(confirm('¿Cerrar sesión?')){ try{localStorage.removeItem('primemx_sesion_v1');}catch(e){} location.href='index.html'; } },200); break;
    }
  };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')pmdClose(); });
  var sx=null;
  d.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  d.addEventListener('touchmove',function(e){ if(sx===null)return; var dx=e.touches[0].clientX-sx; if(dx<0)d.style.transform='translateX('+dx+'px)'; },{passive:true});
  d.addEventListener('touchend',function(e){ if(sx===null)return; var dx=e.changedTouches[0].clientX-sx; d.style.transform=''; if(dx<-70)pmdClose(); sx=null; });
})();
</script>
