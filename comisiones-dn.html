<title>Comisiones · Dirección Nacional — TechGuide</title>

<style>
:root{
  --bg:#080D16;--surface:#0F1622;--surface2:#16202E;--surface3:#1F2B3C;
  --label:#EDF2F8;--label2:#D7E0EB;--label3:#8A97A9;--label4:#414E5F;
  --sep:rgba(237,242,248,0.10);
  --blue:#31A5E5;--cyan:#4DB4EC;--green:#30D158;--mint:#3BC292;
  --red:#FF453A;--red-soft:#FF8A80;--amber:#FFD60A;
  --r-xl:22px;--r-lg:16px;--r-md:12px;
  --att-blue:#31A5E5;--att-cyan:#4DB4EC;--pmd-accent:#31A5E5;--pmd-navy:#13203E;--pmd-danger:#FF453A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.phone{width:100%;background:var(--bg);color:var(--label);overflow:hidden;position:relative;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:560px;margin:0 auto;width:100%;padding-bottom:40px}

.nav{position:sticky;top:0;z-index:40;background:rgba(8,13,22,.92);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep);
  display:flex;align-items:center;gap:8px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top))}
.nav-back{background:none;border:none;color:var(--blue);font-size:15px;
  font-family:inherit;display:flex;align-items:center;gap:2px;padding:0;cursor:pointer}
.nav-t{flex:1;font-size:16px;font-weight:600;letter-spacing:-.02em}
.nav-cta{background:var(--blue);color:#fff;border:none;border-radius:22px;
  padding:10px 17px;font-size:14px;font-weight:700;font-family:inherit;
  display:flex;align-items:center;gap:6px;cursor:pointer;
  box-shadow:0 2px 10px rgba(49,165,229,.32)}
.nav-cta:active{opacity:.7}

.pad{padding:14px 16px}

/* ── Hero ── */
.hero{background:var(--surface);border:1px solid rgba(0,168,224,.22);
  border-radius:var(--r-xl);padding:16px 17px}
.hero-top{display:flex;align-items:center;gap:8px}
.hero-l{color:var(--label3);font-size:10px;letter-spacing:.7px;flex:1}
.piso{display:flex;align-items:center;gap:4px;border-radius:20px;padding:3px 9px;
  font-size:10px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
.piso.ok{background:rgba(48,209,88,.13);color:var(--green)}
.piso.no{background:rgba(255,69,58,.13);color:var(--red-soft)}
.hero-v{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.hero-v.off{color:var(--label4)}
.hero-s{color:var(--label3);font-size:11.5px;margin-top:3px}

/* ── Monedero ── */
.mon{background:var(--surface);border:1px solid rgba(59,194,146,.28);
  border-radius:var(--r-xl);padding:17px 17px 15px;margin-top:10px;
  width:100%;text-align:left;font-family:inherit;cursor:pointer;display:block}
.mon:active{opacity:.75}
.mon-row{display:flex;align-items:center;gap:14px}
.mon-ico{width:54px;height:54px;border-radius:16px;background:rgba(59,194,146,.14);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mon-ico svg{width:30px;height:30px;stroke:var(--mint)}
.mon-l{color:var(--mint);font-size:10px;letter-spacing:.7px}
.mon-v{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:2px;color:var(--label)}
.mon-foot{display:flex;align-items:center;gap:7px;margin-top:13px;padding-top:12px;
  border-top:1px solid var(--sep);color:var(--label3);font-size:11px}
.mon-foot b{color:var(--mint);font-weight:700}

/* ── Métricas ── */
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}
.sec-t{color:var(--label3);font-size:10px;letter-spacing:.7px}
.sec-r{color:var(--label3);font-size:10px}
.mets{display:flex;flex-direction:column;gap:7px}
.met{background:var(--surface2);border-left:3px solid var(--label4);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:11px 13px;
  width:100%;text-align:left;font-family:inherit;border-top:none;border-right:none;
  border-bottom:none;cursor:pointer;display:block}
.met:active{opacity:.75}
.met.g{border-left-color:var(--green)}
.met.a{border-left-color:var(--amber)}
.met.r{border-left-color:var(--red)}
.met-row{display:flex;align-items:center;gap:10px}
.met-n{color:var(--label);font-size:12.5px;font-weight:600}
.met-c{color:var(--label3);font-size:10px;margin-top:2px}
.met-c b{color:var(--label);font-weight:700}
.met-c.warn{color:var(--amber)}
.met-c.bad{color:var(--red-soft)}
.met-p{font-size:18px;font-weight:800;letter-spacing:-.02em;text-align:right}
.met-x{font-size:9.5px;text-align:right;margin-top:1px}
.met-x.on{color:var(--mint)}
.met-x.off{color:var(--label3)}
.met-x.bad{color:var(--red-soft)}
.chev{color:var(--label4);flex-shrink:0}
.chev svg{width:15px;height:15px;display:block}
.arpu{margin-top:8px;padding-top:7px;border-top:1px solid rgba(237,242,248,.07);
  display:flex;align-items:center;gap:6px;color:var(--label3);font-size:9.5px}
.arpu svg{width:11px;height:11px;flex-shrink:0}
.arpu b{font-weight:700}
.arpu.ok svg{stroke:var(--mint)} .arpu.ok b{color:var(--mint)}
.arpu.no svg{stroke:var(--red-soft)} .arpu.no b{color:var(--red-soft)}

.note{color:var(--label4);font-size:10px;text-align:center;margin-top:20px;
  font-style:italic;line-height:1.5;padding:0 20px}

/* ── Hoja de detalle ── */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-in{background:var(--bg);width:100%;max-width:560px;max-height:92vh;
  border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;
  animation:up .28s cubic-bezier(.32,.72,0,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-h{display:flex;align-items:center;gap:9px;padding:15px 17px;
  border-bottom:1px solid var(--sep);background:var(--surface);flex-shrink:0}
.sheet-t{flex:1;font-size:16px;font-weight:700;letter-spacing:-.02em}
.sheet-x{background:none;border:none;color:var(--blue);font-size:14px;
  font-family:inherit;cursor:pointer;padding:4px}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:15px 17px 30px;
  padding-bottom:calc(30px + env(safe-area-inset-bottom))}

.esc{display:flex;flex-direction:column-reverse;gap:6px}
.paso{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface2);border-radius:var(--r-md)}
.paso.done{opacity:.45}
.paso.now{background:rgba(48,209,88,.13);border:1px solid rgba(48,209,88,.32)}
.paso.next{border:1px dashed rgba(255,214,10,.4)}
.paso-i{font-size:13px;flex-shrink:0;display:flex}
.paso-i svg{width:14px;height:14px}
.paso.done .paso-i svg{stroke:var(--green)}
.paso.now .paso-i svg{stroke:var(--green)}
.paso.next .paso-i svg{stroke:var(--amber)}
.paso-p{font-size:11px;font-weight:700;width:36px;color:var(--label3)}
.paso.now .paso-p,.paso.now .paso-l{color:var(--green)}
.paso.next .paso-p,.paso.next .paso-l{color:var(--amber)}
.paso-l{font-size:11px;color:var(--label3);flex:1}
.paso-v{font-size:11px;font-weight:700;color:var(--label3)}
.paso.now .paso-v{color:var(--green)}
.paso.next .paso-v{color:var(--amber)}

.tip{margin-top:13px;border-radius:var(--r-md);padding:11px 13px;

.tip.amber{background:rgba(255,214,10,.1);color:var(--amber)}
.tip.red{background:rgba(255,69,58,.1);color:var(--red-soft)}
.tip svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.tip b{font-weight:700}

.lista{background:var(--surface);border-radius:var(--r-md);overflow:hidden;margin-top:9px}
.li{display:flex;padding:10px 13px;font-size:11.5px}
.li+.li{border-top:1px solid var(--sep)}
.li-n{flex:1;color:var(--label)}
.li-v{color:var(--label3)}

.empty{text-align:center;padding:40px 20px;color:var(--label3);font-size:13px;line-height:1.6}

/* ── Propio del hub regional ── */
.pill{background:rgba(0,168,224,.13);color:var(--cyan);font-size:9.5px;font-weight:700;
  padding:3px 9px;border-radius:20px}
.weeks{display:flex;gap:7px;padding:2px 2px 4px;overflow-x:auto;margin-bottom:14px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;border:none;cursor:pointer;font-family:inherit;background:var(--surface);
  color:var(--label3);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600}
.wk small{display:block;font-size:9px;font-weight:600;opacity:.7;letter-spacing:.4px;
  text-transform:uppercase}
.wk.on{background:var(--blue);color:#fff}
.alerta{border-radius:var(--r-md);padding:11px 13px;display:flex;gap:9px;

.alerta svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.alerta b{font-weight:800}
.alerta.amber{background:rgba(255,214,10,.1);color:var(--amber)}
.alerta.red{background:rgba(255,69,58,.1);color:var(--red-soft)}
.det-hero{background:var(--surface);border:1px solid rgba(0,168,224,.22);
  border-radius:var(--r-lg);padding:14px 15px;display:flex;align-items:flex-end;gap:12px}
.btn-full{width:100%;margin-top:16px;background:var(--blue);color:#fff;border:none;
  border-radius:14px;padding:13px;font-size:13.5px;font-weight:700;font-family:inherit;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-full svg{width:16px;height:16px}
.btn-full:active{opacity:.8}

/* ── Gerente y su bono: el dato que el regional viene a buscar ── */
.hero-sp{display:flex;align-items:baseline;gap:8px;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--sep);color:var(--label3);font-size:11px}
.hero-sp b{color:var(--mint);font-size:16px;font-weight:800;letter-spacing:-.02em}
.hero-sp small{color:var(--label3);font-size:10px}
.gte-row{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:8px;
  border-top:1px solid rgba(237,242,248,.07)}
.gte{width:24px;height:24px;border-radius:50%;background:var(--surface3);color:var(--label2);
  display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;
  flex-shrink:0;letter-spacing:.3px}
.gte.sin{background:rgba(255,69,58,.15);color:var(--red-soft)}
.gte.gde{width:40px;height:40px;font-size:14px}
.gte-n{flex:1;min-width:0;color:var(--label3);font-size:11px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.gte-n.vacio{color:var(--red-soft)}
.gte-v{color:var(--mint);font-size:13.5px;font-weight:800;letter-spacing:-.02em;
  text-align:right;flex-shrink:0}
.gte-v small{display:block;color:var(--label3);font-size:9px;font-weight:600}
.gte-card{background:var(--surface2);border-radius:var(--r-lg);padding:13px 14px;
  display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gte-rol{display:block;color:var(--label3);font-size:9px;letter-spacing:.7px;font-weight:700}
.gte-nom{display:block;color:var(--label);font-size:14px;font-weight:700;margin-top:1px}
.gte-big{display:block;color:var(--mint);font-size:18px;font-weight:800;letter-spacing:-.02em}
.gte-pts{display:block;color:var(--label3);font-size:10px;font-weight:600}

.li-n small{display:block;margin-top:2px}

/* ── Drawer compartido (antes en comisiones-ui.css; inline para que el
      tablero no dependa de un archivo externo que puede no resolver) ── */
/* ============================================================================
   comisiones-ui.css — [v1.12.3] UI compartida de los 5 tableros de comisiones.
   ANTES: cada comisiones-*.html traía su propia copia de este bloque (drawer
   pmd-*). Ahora es una sola fuente; los tableros lo enlazan con <link>.
   Nota: usa alias --pmd-* porque los tokens difieren entre tableros
   (ejecutivo: --att-blue · mandos: --blue). También corrige que en los mandos
   var(--att-blue) no existía y el avatar/switch quedaban sin fondo.
   ========================================================================== */
:root{--pmd-accent:#31A5E5;--pmd-navy:#101A30;--pmd-danger:#FF453A}
:root[data-theme="light"]{--pmd-accent:#0E7DBE;--pmd-navy:#13203E;--pmd-danger:#D0291C}

.pmd-overlay{position:fixed;inset:0;z-index:1200;background:rgba(9,13,22,.44);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .26s cubic-bezier(.32,.72,0,1),visibility .26s}
.pmd-overlay.on{opacity:1;visibility:visible}
.pmd-drawer{position:fixed;top:0;left:0;bottom:0;z-index:1201;width:84%;max-width:328px;background:var(--surface);box-shadow:0 18px 60px rgba(0,0,0,.5);transform:translateX(-102%);transition:transform .28s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
.pmd-drawer.on{transform:none}
.pmd-head{padding:22px 20px 18px;display:flex;align-items:center;gap:13px;width:100%;background:transparent;border:none;border-bottom:1px solid var(--sep);cursor:pointer;font-family:inherit;text-align:left;transition:background .16s ease}
.pmd-head:hover{background:var(--surface2)}
.pmd-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--pmd-navy);color:#fff;font-weight:700;font-size:17px;flex-shrink:0;letter-spacing:.02em}
.pmd-who b{display:block;font-size:16px;font-weight:800;color:var(--label);letter-spacing:-.01em}
.pmd-who span{display:block;font-size:12.5px;color:var(--label3);margin-top:2px;font-weight:500}
.pmd-head-chev{width:18px;height:18px;color:var(--label3);flex-shrink:0;margin-left:auto}
.pmd-nav{padding:10px 12px 12px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
.pmd-item{display:flex;align-items:center;gap:13px;padding:12px 13px;border-radius:10px;background:transparent;border:none;color:var(--label);font-size:14.5px;font-weight:600;letter-spacing:-.01em;width:100%;text-align:left;cursor:pointer;font-family:inherit;transition:background .16s ease,transform .1s ease}
.pmd-item svg{width:19px;height:19px;color:var(--label3);flex-shrink:0;stroke-width:1.9;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;transition:color .16s ease}
.pmd-item:hover{background:var(--surface2)}
.pmd-item:hover svg{color:var(--label)}
.pmd-item:active{transform:scale(.98)}
.pmd-item:focus-visible{outline:2px solid var(--pmd-accent);outline-offset:2px}
.pmd-sep{height:1px;background:var(--sep);margin:10px 14px}
.pmd-danger{color:var(--pmd-danger)} .pmd-danger svg{color:var(--pmd-danger)}
.pmd-switch{width:38px;height:22px;border-radius:999px;background:var(--sep);position:relative;transition:background .2s ease;flex-shrink:0}
.pmd-switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s ease}
.pmd-switch.on{background:var(--pmd-accent)}
.pmd-switch.on::after{transform:translateX(16px)}
.pmd-foot{padding:14px 22px calc(16px + env(safe-area-inset-bottom,0));font-size:11px;color:var(--label3);border-top:1px solid var(--sep);font-weight:600}
.pmd-foot b{font-weight:800;color:var(--label)} .pmd-foot b span{color:var(--pmd-accent)}

</style>

<script>
/* ══ HUB DE DIRECCIÓN NACIONAL · 2026 ══════════════════════════════════════
   El techo de la escalera: agrupa REGIONES con su director a cargo. Mismo
   patrón que los dos niveles de abajo — peor primero, drill hacia el detalle.

   A esta altura el valor no es el monto sino la dispersión: qué región se
   está quedando y en qué indicador. Por eso el drill de métrica es el que
   más sirve aquí.
   ═════════════════════════════════════════════════════════════════════════ */

var ASESOR=null;
try{ ASESOR=JSON.parse(localStorage.getItem('primemx_sesion_v1')||'null'); }catch(e){}

var METRICAS=[
  {k:'equipo',n:'Equipo'},{k:'servicio',n:'Servicio'},{k:'renovacion',n:'Renovación'},
  {k:'accesorios',n:'Accesorios'},{k:'seguros',n:'Seguros'},{k:'prepago',n:'Prepago'}
];

var EST={ periodo:'', regiones:[], cargando:true };

function isoWeek(d){
  d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  var ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-ys)/86400000)+1)/7);
}
function isoYear(d){
  d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  return d.getUTCFullYear();
}
function periodoDe(d){ return isoYear(d)+'-W'+String(isoWeek(d)).padStart(2,'0'); }
function semDe(p){ return Number(String(p).split('-W')[1]||0); }

function ini(nombre){
  var p=String(nombre||'').trim().split(/\s+/);
  return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'');
}
function fmx(n){ return '$'+Math.round(n||0).toLocaleString('es-MX'); }
function pct(u,c){ return (!c||c<=0)?0:(u/c)*100; }
function claseMet(p){ return p<80?'r':(p<100?'a':'g'); }

function semanasChips(){
  var h=new Date(), o='';
  for(var i=-6;i<=1;i++){
    var d=new Date(h); d.setDate(d.getDate()+i*7);
    var v=periodoDe(d);
    o+='<button class="wk'+(v===EST.periodo?' on':'')+'" onclick="irSemana(\''+v+'\')">'
      +'<small>Sem</small>'+isoWeek(d)+'</button>';
  }
  return o;
}
function irSemana(v){ EST.periodo=v; cargar(); }
function centrarSemana(){
  var w=document.getElementById('weeks');
  var a=w && w.querySelector('.wk.on');
  if(w && a) w.scrollLeft = a.offsetLeft - (w.clientWidth/2) + (a.offsetWidth/2);
}

/* Resumen de una tienda: cuántas métricas cobran y cuál va peor. */
function resumen(t){
  var cobra=0, sinCuota=0, peor=null;
  METRICAS.forEach(function(m){
    var c=t.cuotas[m.k]||0;
    if(!c){ sinCuota++; return; }
    var p=pct(t.unidades[m.k]||0, c);
    if(p>=80) cobra++;
    if(peor===null || p<peor.p) peor={k:m.k, n:m.n, p:p};
  });
  return { cobra:cobra, sinCuota:sinCuota, peor:peor,
           conCuota:METRICAS.length-sinCuota };
}

function pintar(){
  var h='';
  h+='<div class="weeks" id="weeks">'+semanasChips()+'</div>';

  if(EST.cargando){

      +'Revisa que existan ventas capturadas en el periodo.</span></div>';
    centrarSemana(); return;
  }

  /* Panorama: base generada, tiendas con problema, métricas sin cuota. */
  var baseTot=0, conProblema=0, sinCuotaAlguna=0;

    METRICAS.forEach(function(m){ baseTot += t.base[m.k]||0; });

    +'<span class="hero-l">PRODUCCIÓN NACIONAL</span>'
    +'<span class="pill">Sem '+semDe(EST.periodo)+'</span></div>'
    +'<div class="hero-v">'+fmx(baseTot)+'</div>'

    +'<b>'+fmx(gteTot)+'</b>'
    +(ptsTot>0?'<small>+'+Math.round(ptsTot).toLocaleString('es-MX')+' pts</small>':'')

    h+='<div class="alerta amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'

      +'<span><b>'+conProblema+'</b> zona'+(conProblema===1?'':'s')+' con métricas abajo del 80%.</span></div>';

    var u=0,c=0,tiendasMal=0;
    EST.regiones.forEach(function(t){
      u+=t.unidades[m.k]||0; c+=t.cuotas[m.k]||0;
      if((t.cuotas[m.k]||0)>0 && pct(t.unidades[m.k]||0,t.cuotas[m.k])<80) tiendasMal++;
    });
    var p=pct(u,c);
    h+='<button class="met '+claseMet(p)+'" onclick="verMetrica(\''+m.k+'\')">'
      +'<span class="met-row"><span style="flex:1;min-width:0">'
      +'<span class="met-n">'+m.n+'</span><br>'
      +'<span class="met-c'+(tiendasMal?' bad':'')+'">'+u+' de '+Math.round(c)
      +(tiendasMal?' · <b>'+tiendasMal+'</b> regi'+(tiendasMal===1?'ón':'ones')+' abajo del 80%':'')+'</span></span>'
      +'<span><span class="met-p">'+Math.round(p)+'%</span></span>'
      +'<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></span></button>';
  });
  h+='</div>';

  /* Tiendas: de peor a mejor. Los problemas primero. */
  var orden=EST.regiones.slice().sort(function(a,b){
    var ra=resumen(a), rb=resumen(b);
    if(ra.sinCuota!==rb.sinCuota) return rb.sinCuota-ra.sinCuota;
    var pa=ra.peor?ra.peor.p:999, pb=rb.peor?rb.peor.p:999;
    return pa-pb;
  });

  h+='<div class="sec"><span class="sec-t">REGIONES</span>'
    +'<span class="sec-r">de peor a mejor</span></div><div class="mets">';
  orden.forEach(function(t){
    var r=resumen(t);
    var cls = r.sinCuota===METRICAS.length ? 'r'
            : (r.cobra<r.conCuota ? 'a' : 'g');
    var det = r.sinCuota===METRICAS.length
      ? '<span class="met-c bad">Sin cuota capturada</span>'
      : '<span class="met-c'+(r.cobra<r.conCuota?' warn':'')+'">'
        +r.cobra+' de '+r.conCuota+' métricas cobrando'
        +(r.peor && r.peor.p<80 ? ' · '+r.peor.n+' al '+Math.round(r.peor.p)+'%' : '')+'</span>';
    var gte = t.director
      ? '<span class="gte">'+ini(t.director)+'</span><span class="gte-n">'+t.director+'</span>'
      : '<span class="gte sin">?</span><span class="gte-n vacio">Sin gerente asignado</span>';
    h+='<button class="met '+cls+'" onclick="verRegion(\''+t.id+'\')">'
      +'<span class="met-row"><span style="flex:1;min-width:0">'
      +'<span class="met-n">'+t.nombre+'</span><br>'+det+'</span>'
      +'<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></span>'
      /* Lo que gana el gerente: el dato que el regional viene a buscar. */
      +'<span class="gte-row">'+gte
      +'<span class="gte-v">'+fmx(t.bonoDir)
      +(t.ptsDir>0?'<small>+'+Math.round(t.ptsDir).toLocaleString('es-MX')+' pts</small>':'')
      +'</span></span>'
      +'</button>';
  });
  h+='</div>';

  h+='<div class="note">Las cantidades son una simulación informativa y no representan el cobro real.</div>';
  document.getElementById('cuerpo').innerHTML=h;
  centrarSemana();
}

function verRegion(id){

  });
  h+='</div>';

  /* Las tiendas de la zona, también de peor a mejor. */

    });

              : r.cobra+'/'+r.conCuota+' cobrando';
      h+='<div class="li"><span class="li-n">'+x.nombre
        +(x.gerente?'<br><small style="color:var(--label4);font-size:9.5px">'+x.gerente+'</small>':'')
        +'</span><span class="li-v" style="color:'+color+';font-weight:700">'+txt+'</span></div>';

             p:pct(t.unidades[k]||0, t.cuotas[k]||0), b:t.base[k]||0 };

<script>
window.bootDN = async function(){
  if(!ASESOR || !window.TG_FB) return;
  var periodo = EST.periodo;
  try{
    var direcciones = await TG_FB.plantillaNacional();
    var ventasPorTienda = await TG_FB.ventasDePeriodo(periodo);

    function mapear(v){
      var t=(v.tipo==='pospago'||v.tipo==='migra')?'equipo'
           :v.tipo==='renov'?'renovacion':v.tipo==='acces'?'accesorio':v.tipo;
      var met = t==='equipo'?'equipo':t==='renovacion'?'renovacion'
              :(t==='accesorio'||t==='addon')?'accesorios'
              :t==='seguro'?'seguros':t==='prepago'?'prepago':t;
      return {tipo:t, metrica:met, plan:v.plan, unidades:1, com:v.com, valor:v.valor,
              recarga:v.recarga, alphacomm:v.alphacomm, precioEquipo:v.precioEquipo};
    }

    /* Una tienda: unidades, base y el bono de su gerente. */
    async function calcTienda(t){
      var vs=(ventasPorTienda[t.id]||[]).map(mapear);
      var cq=await TG_FB.cuotasDeTienda(t.id, periodo);
      var u={}, b={}, tot=0, bono=0, pts=0;
      vs.forEach(function(v){
        u[v.metrica]=(u[v.metrica]||0)+1;
        if(typeof comisionUnitaria2026==='function'){
          var c=comisionUnitaria2026(v); b[v.metrica]=(b[v.metrica]||0)+c; tot+=c;
        }
      });
      if(typeof calcularGerente2026==='function'){
        var mets=['equipo','servicio','renovacion','accesorios','seguros','prepago'].map(function(k){
          var c=cq[k]||0;
          return { nombre:k, baseTienda:b[k]||0, alcance:c>0?((u[k]||0)/c)*100:0 };
        });
        var ar=(typeof calcularARPU2026==='function')?calcularARPU2026(vs):{equipo:null,servicio:null};
        var g=calcularGerente2026(mets,{arpuEquipo:ar.equipo,arpuServicio:ar.servicio});
        bono=g.bonoSemanal; pts=g.puntosTotales;
      }
      return { id:t.id, nombre:t.nombre, gerente:t.gerente,
               unidades:u, base:b, cuotas:cq, total:tot, bonoGte:bono, ptsGte:pts };
    }

    function acumular(destino, origen){
      Object.keys(origen).forEach(function(k){ destino[k]=(destino[k]||0)+origen[k]; });
    }

    var datos = await Promise.all(direcciones.map(async function(D){
      var uni={}, base={}, cuotas={}, total=0, bonoDir=0, ptsDir=0, nTiendas=0;
      var zonas = await Promise.all(D.zonas.map(async function(Z){
        var zu={}, zb={}, zc={}, zt=0, zbono=0, zpts=0;
        var tiendas = await Promise.all(Z.tiendas.map(calcTienda));
        tiendas.forEach(function(t){
          acumular(zu,t.unidades); acumular(zb,t.base); acumular(zc,t.cuotas);
          zt+=t.total; zbono+=t.bonoGte; zpts+=t.ptsGte;
        });
        nTiendas += tiendas.length;
        acumular(uni,zu); acumular(base,zb); acumular(cuotas,zc);
        total+=zt; bonoDir+=zbono; ptsDir+=zpts;
        return { id:Z.id, nombre:Z.nombre, gerente:Z.regional,
                 unidades:zu, base:zb, cuotas:zc, total:zt,
                 bonoGte:zbono, ptsGte:zpts, tiendas:tiendas.length };
      }));
      return { id:D.id, nombre:D.nombre, director:D.director,
               unidades:uni, base:base, cuotas:cuotas, total:total,
               zonas:zonas.length, tiendas:nTiendas, asesores:D.asesores,
               bonoDir:bonoDir, ptsDir:ptsDir, detalleZonas:zonas };
    }));
    EST.regiones = datos;
  }catch(e){ console.error('bootDN', e); EST.regiones=[]; }
  EST.cargando=false;
  pintar();
};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC9qhK78TKkLUu_gcN3WRwyKV8-mTk1Lsc",authDomain:"techguide-primemx.firebaseapp.com",projectId:"techguide-primemx",storageBucket:"techguide-primemx.firebasestorage.app"};
const db=getFirestore(initializeApp(cfg));

function bonito(id){
  return String(id).replace(/^prm[-_]/i,'').replace(/[-_]+/g,' ')
    .replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

window.TG_FB={
  /* Toda la plantilla nacional en una consulta. Se agrupa en tres niveles:
     dirección → zona → tienda. Nombrar bien importa: aquí 'region' es la
     dirección (el nivel del director) y 'zona' la del regional. */
  async plantillaNacional(){
    const dir={};
    try{
      const s=await getDocs(query(collection(db,'empleados')));
      s.forEach(function(d){
        const o=d.data();
        if(!o || !o.tienda) return;
        const rd = String(o.direccion || o.region || 'sin-direccion');
        const rz = String(o.zona || o.region || 'sin-zona');
        if(!dir[rd]) dir[rd]={ id:rd, nombre:bonito(rd), director:'', zonas:{}, asesores:0 };
        const D=dir[rd];
        if(!D.zonas[rz]) D.zonas[rz]={ id:rz, nombre:bonito(rz), regional:'', tiendas:{} };
        const Z=D.zonas[rz];
        if(!Z.tiendas[o.tienda]) Z.tiendas[o.tienda]={ id:o.tienda, nombre:bonito(o.tienda), gerente:'' };
        const rol=String(o.rol||'').toLowerCase();
        if(rol==='gerente') Z.tiendas[o.tienda].gerente=o.nombre||'';
        else if(rol==='regional'){ if(!Z.regional) Z.regional=o.nombre||''; }
        else if(rol==='director'){ if(!D.director) D.director=o.nombre||''; }
        else D.asesores++;
      });
    }catch(e){ console.error('plantillaNacional',e); }
    return Object.keys(dir).map(function(k){
      const D=dir[k];
      return { id:D.id, nombre:D.nombre, director:D.director, asesores:D.asesores,
               zonas:Object.keys(D.zonas).map(function(z){
                 const Z=D.zonas[z];
                 return { id:Z.id, nombre:Z.nombre, regional:Z.regional,
                          tiendas:Object.keys(Z.tiendas).map(function(t){ return Z.tiendas[t]; }) };
               }) };
    });
  },
  async ventasDePeriodo(periodo){
    const porTienda={};
    try{
      const s=await getDocs(query(collection(db,'comisiones_ventas'),where('periodo','==',periodo)));
      s.forEach(function(d){
        const o=d.data();
        if(!o || !o.tienda) return;
        (porTienda[o.tienda]=porTienda[o.tienda]||[]).push(o);
      });
    }catch(e){ console.error('ventasDePeriodo',e); }
    return porTienda;
  },
  async cuotasDeTienda(tienda, periodo){
    try{
      const s=await getDoc(doc(db,'comisiones_cuotas',tienda+'__'+periodo));
      if(!s.exists()) return {};
      const d=s.data();
      if(!d.metricas && typeof d.cuota==='number') return { equipo:d.cuota };
      const r={};
      Object.keys(d.metricas||{}).forEach(function(k){
        const v=d.metricas[k];
        if(v && v.valor!==undefined) r[k]=Number(v.valor);
      });
      return r;
    }catch(e){ return {}; }
  }
};

if(window.bootDN) window.bootDN();
</script>

<script>
/* ── Menú lateral (drawer) — portado del home v1.11.47 ── */
(function(){
  var d=document.getElementById('pmd-drawer'), ov=document.getElementById('pmd-overlay');
  if(!d||!ov) return;
  function pmdCuotasVisible(){
    /* La entrada de cuotas solo existe para gerente en adelante. */
    try{
      var s=JSON.parse(localStorage.getItem('primemx_sesion_v1')||'null');
      var J={gerente:1,regional:2,director:3,director_nacional:4};
      var el=document.getElementById('pmd-cuotas');
      if(el && s && J[String(s.rol||'').toLowerCase()]) el.style.display='';
    }catch(e){}
  }
  function pmdSes(){try{return JSON.parse(localStorage.getItem('primemx_sesion_v1')||'null');}catch(e){return null;}}
  window.pmdOpen=function(){ pmdCuotasVisible();
    try{
      var s=pmdSes();
      if(s&&s.attuid){
        var nm=s.name||s.nombre||'Asesor';
        var eN=document.getElementById('pmd-name'); if(eN)eN.textContent=nm;
        var eR=document.getElementById('pmd-role');
        if(eR){var r=String(s.rol||'asesor'); var reg=s.region?(' · '+s.region):''; eR.textContent=r.charAt(0).toUpperCase()+r.slice(1)+reg;}
        var eA=document.getElementById('pmd-avatar');
        if(eA){var p=String(nm).trim().split(/\s+/); eA.textContent=(((p[0]||'')[0]||'')+((p[1]||'')[0]||''))||(String(nm)[0]||'P');}
        var acc=document.getElementById('pmd-accesos');
        if(acc){var rl=String(s.rol||'').toLowerCase();acc.style.display=(s.attuid==='DC499W'||['regional','director','director_nacional'].indexOf(rl)>=0)?'flex':'none';}
      }
    }catch(e){}
    if(window.pmdSyncTheme)pmdSyncTheme(); if(window.pmdSyncDesktop)pmdSyncDesktop();
    d.classList.add('on'); ov.classList.add('on'); document.body.style.overflow='hidden';
  };
  window.pmdClose=function(){ d.classList.remove('on'); ov.classList.remove('on'); document.body.style.overflow=''; };
  window.pmdSyncTheme=function(){ var sw=document.getElementById('pmd-theme-sw'); if(!sw)return; sw.classList.toggle('on',document.documentElement.getAttribute('data-theme')!=='light'); };
  window.pmdGo=function(a){
    var go=function(url){ pmdClose(); setTimeout(function(){ location.href=url; },160); };
    switch(a){
      case 'inicio':  go('index.html'); break;
      case 'momento': go('index.html#momento'); break;
      case 'topcomm': go('index.html#topcomm'); break;
      case 'comisiones': pmdClose(); break;
      case 'cuotas': go('comisiones-cuotas.html'); break;
      case 'dash':    go('index.html#actividad'); break;
      case 'calc':    go('index.html#calc'); break;
      case 'diag':    go('index.html#diag'); break;
      case 'accesos': go('index.html#accesos'); break;
      case 'perfil':  go('index.html#perfil'); break;
      case 'refresh': pmdClose(); setTimeout(function(){ if(typeof refreshDash==='function')refreshDash(); },220); break;
      case 'logout':  pmdClose(); setTimeout(function(){ if(confirm('¿Cerrar sesión?')){ try{localStorage.removeItem('primemx_sesion_v1');}catch(e){} location.href='index.html'; } },200); break;
    }
  };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')pmdClose(); });
  var sx=null;
  d.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  d.addEventListener('touchmove',function(e){ if(sx===null)return; var dx=e.touches[0].clientX-sx; if(dx<0)d.style.transform='translateX('+dx+'px)'; },{passive:true});
  d.addEventListener('touchend',function(e){ if(sx===null)return; var dx=e.changedTouches[0].clientX-sx; d.style.transform=''; if(dx<-70)pmdClose(); sx=null; });
})();
</script>
